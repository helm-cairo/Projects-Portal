    (kids.length ? '<div class="sec">الأبناء</div><table><thead><tr><th>الاسم</th><th>النوع</th><th>السن</th><th>المرحلة</th></tr></thead><tbody>' + kids.map(k => '<tr><td>' + esc(k.name || '') + '</td><td>' + esc(k.gender || '') + '</td><td>' + esc(k.age ?? '') + '</td><td>' + esc(k.stage || '') + '</td></tr>').join('') + '</tbody></table>' : '') +
    ((c.notes || c.otherComments) ? '<div class="sec">ملاحظات</div><p>' + esc([c.notes, c.otherComments].filter(Boolean).join(' — ')) + '</p>' : '');
  makePdf('حالة-' + (codeOf(c) || c.idName || id) + '.pdf', c.idName || 'ملف حالة', 'ملف حالة · سجل حالات فريق حلم · ' + esc(dateLabel(todayISO())), inner, false);
}

/* ---------- donors ---------- */
if(!S.donors) S.donors = new Map();
const donorList = () => [...S.donors.values()].sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ar'));
function donorOf(m){ const d = m && m.donorId && S.donors.get(m.donorId); return {name: (d && d.name) || (m && m.donorName) || '', phone: (d && d.phone) || (m && m.donorPhone) || ''}; }
function donorOptions(m){
  m = m || {};
  let o = '<option value="">— اختر المتبرع —</option>' + donorList().map(d => '<option value="' + esc(d.id) + '"' + (m.donorId === d.id ? ' selected' : '') + '>' + esc(d.name) + (d.phone ? ' · ' + esc(d.phone) : '') + '</option>').join('');
  if(!m.donorId && m.donorName) o += '<option value="__legacy" selected>' + esc(m.donorName) + ' (غير مسجّل في المتبرعين)</option>';
  return o;
}
function monthlyFromForm(m){
  const v = $('#f_mDonor').value, d = v && v !== '__legacy' ? S.donors.get(v) : null;
  return {active: true, amount: num($('#f_mAmt').value) || 0, startDate: $('#f_mStart').value,
    donorId: d ? d.id : null, donorName: d ? d.name : ((m && m.donorName) || ''), donorPhone: d ? (d.phone || '') : ((m && m.donorPhone) || ''), donorNote: $('#f_dNote').value.trim()};
}
const casesOfDonor = d => [...S.cases.values()].filter(c => c.monthly && c.monthly.active && (c.monthly.donorId === d.id || (!c.monthly.donorId && d.name && norm(c.monthly.donorName || '') === norm(d.name))));
function donorDialog(id, cb){
  if(!S.db){ toast('الحفظ غير متاح في هذا العرض'); return; }
  const d = id ? S.donors.get(id) : {};
  const el = document.createElement('div'); el.className = 'confirm';
  el.innerHTML = '<form class="box" role="dialog" aria-modal="true" style="max-width:460px"><h3>' + (id ? 'تعديل بيانات المتبرع' : 'متبرع جديد') + '</h3><div class="grid" style="margin-top:10px">' +
    '<div class="field span"><label for="dnName">اسم المتبرع <span class="req">*</span></label><input id="dnName" type="text" value="' + esc(d.name || '') + '" placeholder="مثل: أ. خالد محمود"></div>' +
    '<div class="field span"><label for="dnPhone">رقم الهاتف</label><input id="dnPhone" type="tel" dir="ltr" value="' + esc(d.phone || '') + '"></div>' +
    '<div class="field span"><label for="dnNote">ملاحظات</label><input id="dnNote" type="text" value="' + esc(d.note || '') + '" placeholder="يدفع أول كل شهر، يفضّل التواصل واتساب…"></div></div>' +
    '<p class="err" id="dnErr"></p><div class="inline" style="margin-top:12px"><button class="btn primary" type="submit">حفظ</button><button class="btn ghost" type="button" data-x>إلغاء</button></div></form>';
  document.body.appendChild(el); $('#dnName', el).focus();
  el.addEventListener('click', e => { if(e.target === el || e.target.closest('[data-x]')) el.remove(); });
  $('form', el).addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#dnName', el).value.trim(), phone = toLatin($('#dnPhone', el).value.trim()), note = $('#dnNote', el).value.trim();
    if(!name){ $('#dnErr', el).textContent = 'اكتب اسم المتبرع.'; return; }
    if([...S.donors.values()].some(x => x.id !== id && norm(x.name) === norm(name))){ $('#dnErr', el).textContent = 'يوجد متبرع مسجّل بنفس الاسم.'; return; }
    const did = id || ('d' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    const doc = {...(id ? d : {createdAt: new Date().toISOString(), createdBy: S.uid}), name, phone, note, updatedAt: new Date().toISOString()};
    delete doc.id;
    if(await guard(() => S.db.doc('donors/' + did).set(doc), id ? 'تم حفظ بيانات المتبرع' : 'تمت إضافة المتبرع')){
      S.donors.set(did, {id: did, ...doc}); el.remove(); if(cb) cb(did); if(S.tab === 'donors') renderDonors();
    }
  });
}
async function linkLegacyDonor(name){
  const cs = [...S.cases.values()].filter(c => c.monthly && c.monthly.active && !c.monthly.donorId && norm(c.monthly.donorName || '') === norm(name));
  if(!cs.length) return;
  const phone = cs.find(c => c.monthly.donorPhone)?.monthly.donorPhone || '';
  const did = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const doc = {name, phone, note: '', createdAt: new Date().toISOString(), createdBy: S.uid, updatedAt: new Date().toISOString()};
  if(!(await guard(() => S.db.doc('donors/' + did).set(doc)))) return;
  S.donors.set(did, {id: did, ...doc});
  let ok = 0;
  for(const c of cs){ if(await guard(() => S.db.doc('cases/' + c.id).update({monthly: {...c.monthly, donorId: did, donorName: name}}))){ c.monthly = {...c.monthly, donorId: did, donorName: name}; ok++; } }
  toast('تم تسجيل "' + name + '" وربطه بـ ' + fmt(ok) + ' حالة'); renderDonors();
}
function renderDonors(){
  const v = $('#view-donors'); if(!v) return;
  const can = S.canApprove, q = norm(S.dq || '');
  const ds = donorList().map(d => { const cs = casesOfDonor(d); return {d, cs, amt: cs.reduce((s, c) => s + num(c.monthly.amount), 0)}; });
  const legacy = {};
  [...S.cases.values()].forEach(c => { const m = c.monthly; if(m && m.active && !m.donorId && m.donorName && ![...S.donors.values()].some(d => norm(d.name) === norm(m.donorName))){ const k = m.donorName.trim(); (legacy[k] = legacy[k] || []).push(c); } });
  const noDonor = [...S.cases.values()].filter(c => c.monthly && c.monthly.active && !c.monthly.donorId && !c.monthly.donorName);
  const shown = ds.filter(x => !q || norm(x.d.name + ' ' + (x.d.phone || '')).includes(q));
  const totalAmt = [...S.cases.values()].filter(c => c.monthly && c.monthly.active).reduce((s, c) => s + num(c.monthly.amount), 0);
  v.innerHTML = '<div class="shead"><div><h2>المتبرعون</h2><p class="muted" style="margin:2px 0 0;font-size:.85rem">سجّل كل متبرع مرة واحدة، ثم اختره من قائمة "المتبرع" في الكفالة الشهرية داخل ملف الحالة.</p></div>' + (can ? '<button class="btn primary" type="button" id="dnAdd">+ متبرع جديد</button>' : '') + '</div>' +
    '<div class="summary"><div class="stat"><div class="l">المتبرعون المسجّلون</div><div class="v num">' + fmt(ds.length) + '</div></div><div class="stat"><div class="l">حالات مكفولة شهريًا</div><div class="v num">' + fmt([...S.cases.values()].filter(c => c.monthly && c.monthly.active).length) + '</div></div><div class="stat"><div class="l">إجمالي الكفالات شهريًا</div><div class="v num">' + money(totalAmt) + '</div></div></div>' +
    '<div class="toolbar"><div class="field grow"><label for="dnQ">بحث</label><input id="dnQ" type="search" placeholder="اسم المتبرع أو رقمه…" value="' + esc(S.dq || '') + '"></div></div>' +
    (shown.length ? '<div class="dlist">' + shown.map(x => '<details class="drec"><summary><span class="dn"><b>' + esc(x.d.name) + '</b>' + (x.d.phone ? '<span class="muted num" dir="ltr">' + esc(x.d.phone) + '</span>' : '') + '</span><span class="dc num">' + fmt(x.cs.length) + ' حالة</span><span class="da num">' + money(x.amt) + ' <small>شهريًا</small></span></summary>' +
      '<div class="dbody">' + (x.d.note ? '<p class="muted" style="margin:0 0 8px">' + esc(x.d.note) + '</p>' : '') +
      (x.cs.length ? '<table class="dtbl"><thead><tr><th>الكود</th><th>الحالة</th><th>المنطقة</th><th>المبلغ الشهري</th><th>منذ</th></tr></thead><tbody>' + x.cs.map(c => '<tr><td dir="ltr" class="num">' + esc(codeOf(c) || '—') + '</td><td><button class="lnk" type="button" data-open="' + esc(c.id) + '">' + esc(c.idName || '') + '</button></td><td>' + esc(c.area || '—') + '</td><td class="num">' + money(c.monthly.amount) + '</td><td class="num">' + esc(c.monthly.startDate ? ymLabel(c.monthly.startDate) : '—') + '</td></tr>').join('') + '</tbody><tfoot><tr><td colspan="3">الإجمالي الشهري</td><td class="num">' + money(x.amt) + '</td><td></td></tr></tfoot></table>' : '<p class="muted" style="margin:0">لا يكفل أي حالة حاليًا.</p>') +
      (can ? '<div class="inline" style="margin-top:10px"><button class="btn sm" type="button" data-dedit="' + esc(x.d.id) + '">تعديل</button>' + (x.cs.length ? '' : '<button class="btn sm danger" type="button" data-ddel="' + esc(x.d.id) + '">حذف</button>') + '</div>' : '') + '</div></details>').join('') + '</div>'
      : '<div class="empty section"><h3>' + (ds.length ? 'لا توجد نتائج' : 'لم يُسجَّل أي متبرع بعد') + '</h3><p class="muted">' + (ds.length ? 'جرّب بحثًا آخر.' : (can ? 'اضغط "+ متبرع جديد" لإضافة أول متبرع.' : '')) + '</p></div>') +
    (Object.keys(legacy).length ? '<div class="card section"><h3>أسماء متبرعين مكتوبة في الحالات وغير مسجّلة</h3><p class="muted" style="margin:0 0 8px;font-size:.85rem">هذه الأسماء كُتبت باليد في ملفات الحالات قبل تبويب المتبرعين. سجّلها ليتم ربطها بالحالات تلقائيًا.</p>' +
      Object.entries(legacy).map(([n, cs]) => '<div class="lrow"><span><b>' + esc(n) + '</b> <span class="muted num">· ' + fmt(cs.length) + ' حالة · ' + money(cs.reduce((s, c) => s + num(c.monthly.amount), 0)) + ' شهريًا</span></span>' + (can ? '<button class="btn sm" type="button" data-dlink="' + esc(n) + '">تسجيل وربط</button>' : '') + '</div>').join('') + '</div>' : '') +
    (noDonor.length ? '<p class="muted section" style="font-size:.85rem">' + fmt(noDonor.length) + ' حالة مكفولة بدون متبرع محدد: ' + noDonor.slice(0, 8).map(c => '<button class="lnk" type="button" data-open="' + esc(c.id) + '">' + esc(c.idName || '') + '</button>').join('، ') + (noDonor.length > 8 ? '…' : '') + '</p>' : '');
  $('#dnAdd')?.addEventListener('click', () => donorDialog(null));
  const qi = $('#dnQ'); qi.addEventListener('input', () => { S.dq = qi.value; const pos = qi.selectionStart; renderDonors(); const n = $('#dnQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} });
  v.onclick = async e => {
    const o = e.target.closest('[data-open]'); if(o){ openCase(o.dataset.open); return; }
    const ed = e.target.closest('[data-dedit]'); if(ed){ donorDialog(ed.dataset.dedit); return; }
    const dl = e.target.closest('[data-dlink]'); if(dl){ dl.disabled = true; linkLegacyDonor(dl.dataset.dlink); return; }
    const del = e.target.closest('[data-ddel]'); if(del){ const d = S.donors.get(del.dataset.ddel);
      if(await confirmBox('حذف المتبرع "' + (d?.name || '') + '"؟', 'لا يكفل هذا المتبرع أي حالة حاليًا.', 'حذف', true) && await guard(() => S.db.doc('donors/' + d.id).delete(), 'تم حذف المتبرع')){ S.donors.delete(d.id); renderDonors(); } }
  };
}

/* ---------- distribution suggestion ---------- */
function lastGot(cid, actId){ let best = ''; for(const d of S.deliveries.values()) if(d.caseId === cid && d.activityId === actId && (d.date || '') > best) best = d.date || ''; return best; }
const sugKey = () => { const D = S.dist; return [D.act, D.ym, D.date, D.area, D.org].join('|'); };
function sugTag(c){
  const g = S.sug; if(!g || g.key !== sugKey() || !g.ids.has(c.id)) return '';
  const last = g.last.get(c.id);
  return '<span class="sugtag">مقترحة · ' + (last ? 'آخر استلام ' + esc(dateLabel(last)) : 'لم تستلم من قبل') + '</span>';
}
function drawSug(){
  const box = $('#dsSug'); if(!box) return;
  const D = S.dist, act = actById(D.act);
  if(!S.canWrite || !act || act.id === 'monthly_cash'){ box.innerHTML = ''; return; }
  const todo = distRows().filter(c => !S.deliveries.has(distKey(c.id)));
  if(!todo.length){ box.innerHTML = ''; return; }
  const g = S.sug && S.sug.key === sugKey() ? S.sug : null;
  box.innerHTML = '<div class="sug"><div class="sugh"><b>اقتراح التوزيع</b><span class="muted">اكتب العدد المتاح معك، ويرشّح السجل الأسر حسب الأولوية: الأطول مدة بدون استلام هذا النشاط (ومن لم تستلم أبدًا أولًا)، ثم غير المكفولين شهريًا.</span></div>' +
    '<div class="sugf"><input id="sugN" type="number" min="1" inputmode="numeric" placeholder="العدد المتاح (وجبات / شنط)" value="' + (g ? g.n : '') + '"><button class="btn primary sm" type="button" id="sugGo">اقترح الأسر</button>' + (g ? '<button class="btn sm ghost" type="button" id="sugClr">إلغاء الاقتراح</button>' : '') + '</div>' +
    (g ? '<p class="sugr">تم تحديد <b class="num">' + fmt(g.ids.size) + '</b> أسرة' + (g.never ? '، منها <b class="num">' + fmt(g.never) + '</b> لم تستلم هذا النشاط من قبل' : '') + '. راجع القائمة، ثم اضغط "تسجيل الاستلام" في الشريط بالأسفل.' + (g.n > g.avail ? ' العدد المتاح أكبر من الأسر المتبقية (' + fmt(g.avail) + ').' : '') + '</p>' : '') + '</div>';
  $('#sugGo').onclick = () => {
    const n = Math.floor(num($('#sugN').value)); if(!(n > 0)){ toast('اكتب العدد المتاح'); $('#sugN').focus(); return; }
    const ranked = todo.map(c => ({c, last: lastGot(c.id, act.id), mon: c.monthly && c.monthly.active ? 1 : 0}))
      .sort((a, b) => (a.last || '').localeCompare(b.last || '') || (a.mon - b.mon) || ((a.c.seq || 0) - (b.c.seq || 0)));
    const pick = ranked.slice(0, n);
    sel.clear(); pick.forEach(x => sel.add(x.c.id));
    S.sug = {key: sugKey(), n, avail: todo.length, ids: new Set(pick.map(x => x.c.id)), last: new Map(pick.map(x => [x.c.id, x.last])), never: pick.filter(x => !x.last).length};
    D.status = 'todo'; drawDist();
  };
  $('#sugClr') && ($('#sugClr').onclick = () => { S.sug = null; sel.clear(); drawDist(); });
}

/* ---------- ages ---------- */
function agesCard(all){
  const bars = (B, vals) => { const cnt = B.map(([l, a, b]) => [l, vals.filter(x => x >= a && x <= b).length]); const mx = Math.max(1, ...cnt.map(x => x[1]));
    return '<div class="bars">' + cnt.map(([l, n]) => '<div class="bar"><span>' + l + '</span><span class="t"><i style="width:' + Math.round(n / mx * 100) + '%"></i></span><span class="val num">' + fmt(n) + '</span></div>').join('') + '</div>'; };
  const ages = all.map(c => nidOf(c)).filter(r => r.ok).map(r => r.age);
  const avg = ages.length ? Math.round(ages.reduce((s, x) => s + x, 0) / ages.length) : 0;
  const kids = all.flatMap(c => c.kids || []).map(k => k.age).filter(a => a !== '' && a != null && !isNaN(+a)).map(Number);
  return '<div class="card"><h3>أعمار الحالات</h3>' + (ages.length ? bars([['أقل من ٣٠', 0, 29], ['٣٠ – ٣٩', 30, 39], ['٤٠ – ٤٩', 40, 49], ['٥٠ – ٥٩', 50, 59], ['٦٠ فأكثر', 60, 200]], ages) +
      '<p class="muted" style="margin:10px 0 0;font-size:.82rem">متوسط السن <b class="num">' + fmt(avg) + '</b> سنة، محسوب من الرقم القومي' + (all.length - ages.length ? ' · ' + fmt(all.length - ages.length) + ' حالة بدون رقم قومي صحيح' : '') + '.</p>' : '<p class="muted">لا توجد أرقام قومية صحيحة لحساب الأعمار.</p>') + '</div>' +
    '<div class="card"><h3>أعمار الأبناء</h3>' + (kids.length ? bars([['من ٠ إلى ٥', 0, 5], ['من ٦ إلى ١٢', 6, 12], ['من ١٣ إلى ١٨', 13, 18], ['أكبر من ١٨', 19, 200]], kids) +
      '<p class="muted" style="margin:10px 0 0;font-size:.82rem">إجمالي <b class="num">' + fmt(kids.length) + '</b> ابن وبنت مسجّل لهم السن.</p>' : '<p class="muted">لم تُسجَّل أعمار الأبناء بعد.</p>') + '</div>';
}

/* ---------- settings guide ---------- */
const SETTINGS_GUIDE = '<div class="card sguide section"><h3>دليل الإعدادات</h3><dl>' +
  '<dt>المناطق والاختصار</dt><dd>كل منطقة لها اختصار بالإنجليزية (حرف أو حرفان) يظهر في أول كود الحالة، مثل <b dir="ltr">T-012</b> لحالة من ترسا. الكود يُنشأ مرة واحدة عند اعتماد الحالة ولا يتغير بعدها.</dd>' +
  '<dt>الأنشطة والمجموعة</dt><dd>الأنشطة هي ما تستلمه الأسر (شنطة شهرية، إطعام، كسوة…). المجموعة تجمع الأنشطة المتشابهة لتسهيل التصفية في "سجل الاستفادة".</dd>' +
  '<dt>مالي</dt><dd>فعّله إذا كان النشاط نقديًا وله مبلغ يُكتب وقت التسليم، مثل الكفالة الشهرية أو مساعدة علاج. يظهر حينها حقل "المبلغ" في شاشة التوزيع وتُحسب المبالغ في التقارير.</dd>' +
  '<dt>متكرر</dt><dd>فعّله إذا كانت الأسرة يمكن أن تستلم النشاط أكثر من مرة في نفس الشهر، مثل إطعام رمضان كل يوم. بدونه يُسمح باستلام واحد فقط لكل أسرة في الشهر، وتظهر "استلمت" بعده.</dd>' +
  '</dl></div>';
(() => {
  const _dd = drawDist; drawDist = function(){ _dd(); drawSug(); };
  const _rs = renderSettings; renderSettings = function(){ _rs(); const v = $('#view-settings'); if(v && !$('.sguide', v)) v.insertAdjacentHTML('beforeend', SETTINGS_GUIDE); };
})();

setTab(['cases','dist','matrix','reports','settings'].includes(S.tab) ? S.tab : 'cases');
boot();
})();
</script>
