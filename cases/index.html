<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سجل حالات فريق حلم</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#006838">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: sticky header with tabs, one working column; case file opens as a side sheet (full screen on phones). */
:root{
  /* Helm logo palette: #2DB674 leaf green · #00923F deep green · #006838 forest · #8BC53F lime · #D7DF23 yellow */
  --helm-leaf:#2DB674; --helm-deep:#00923F; --helm-forest:#006838; --helm-lime:#8BC53F; --helm-sun:#D7DF23;
  --bg:#F2F8F3; --surface:#FFFFFF; --surface-2:#F5FAF6; --ink:#0F2A1B; --muted:#53695B; --line:#D5E6DA;
  --accent:#006838; --accent-strong:#006838; --accent-ink:#FFFFFF; --accent-soft:#DFF3E7; --bar:#2DB674;
  --ok:#00813A; --ok-soft:#DFF3E7; --season:#A86A06; --season-soft:#FBF0D9; --rej:#B42318; --rej-soft:#FBE6E3; --pend:#3D6BA8; --pend-soft:#E3ECF8;
  --warn:#9A5B00; --shadow:0 10px 30px rgba(22,36,27,.12);
  --f-display:"Reem Kufi","Cairo",Tahoma,sans-serif;
  --f-body:"Cairo","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A12; --surface:#12251A; --surface-2:#163020; --ink:#E4F2E8; --muted:#97B3A0; --line:#244A33;
  --accent:#2DB674; --accent-strong:#8BC53F; --accent-ink:#06180D; --accent-soft:#163A26; --bar:#2DB674;
  --ok:#5CCB8E; --ok-soft:#163A26; --season:#E6B45A; --season-soft:#3A2D12; --rej:#F08A80; --rej-soft:#3D1F1C; --pend:#8DB4EA; --pend-soft:#1D2B40;
  --warn:#E6B45A; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1A12; --surface:#12251A; --surface-2:#163020; --ink:#E4F2E8; --muted:#97B3A0; --line:#244A33;
  --accent:#2DB674; --accent-strong:#8BC53F; --accent-ink:#06180D; --accent-soft:#163A26; --bar:#2DB674;
  --ok:#5CCB8E; --ok-soft:#163A26; --season:#E6B45A; --season-soft:#3A2D12; --rej:#F08A80; --rej-soft:#3D1F1C; --pend:#8DB4EA; --pend-soft:#1D2B40;
  --warn:#E6B45A; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.3rem;display:flex;align-items:center;gap:12px;color:var(--accent-strong)}
.mark{background:#FFFFFF;border-radius:10px;padding:5px 8px;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.mark img{display:block;width:84px;height:auto}
.top::after{content:"";display:block;height:3px;margin-top:-1px;background:linear-gradient(to left,var(--helm-forest),var(--helm-deep) 30%,var(--helm-leaf) 60%,var(--helm-lime) 85%,var(--helm-sun))}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-size:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 7px;margin-inline-start:6px}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--rej);border-color:var(--rej-soft)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.78rem;color:var(--muted)}
.field .err{font-size:.8rem;color:var(--rej);font-weight:600}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;border-radius:20px;padding:1px 10px;white-space:nowrap}
.c-deserve{background:var(--ok-soft);color:var(--ok)}
.c-season{background:var(--season-soft);color:var(--season)}
.c-rejected{background:var(--rej-soft);color:var(--rej)}
.c-pending{background:var(--pend-soft);color:var(--pend)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted);white-space:nowrap}
.tag.warn{border-color:var(--season-soft);background:var(--season-soft);color:var(--warn)}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--season-soft);color:var(--warn);font-weight:600;font-size:.9rem}
.muted{color:var(--muted)}
.section{margin-top:18px}
.empty{padding:40px 16px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty h3{font-size:1.05rem;margin-bottom:6px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:16px}
.toolbar .grow{flex:1 1 220px}
.toolbar .field{flex:0 1 160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:.85rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.7;margin-inline-start:4px}

/* case list */
.list{display:flex;flex-direction:column;gap:0;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:64px 64px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;width:100%}
.row:last-child{border-bottom:0}
/* one line per case on wide screens */
@media (min-width:761px){
  .row:not(.row-head) > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .tags{flex-wrap:nowrap;overflow:visible!important}
  .row .tags > span:first-child{display:inline-flex;align-items:center;gap:8px}
  .row .tags .stamp{display:inline;text-align:start}
}
.row{cursor:pointer}
.row .stsel{min-height:32px;padding:3px 8px;font-size:.82rem;font-weight:700;border-radius:20px;width:auto}
.row .stsel.c-deserve{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.row .stsel.c-season{background:var(--season-soft);color:var(--season);border-color:var(--season-soft)}
.row .stsel.c-rejected{background:var(--rej-soft);color:var(--rej);border-color:var(--rej-soft)}
.row .stsel.c-pending{background:var(--pend-soft);color:var(--pend);border-color:var(--pend-soft)}
.stamp{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;text-align:left}
.rolechip{font-size:.82rem;color:var(--muted)} .rolechip b{color:var(--ink)}
.req{color:var(--rej)}
.row:hover{background:var(--surface-2)}
.row .seq{color:var(--muted);font-weight:600;font-size:.85rem}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .nick{font-weight:500;color:var(--muted);font-size:.85rem}
.row .meta{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.row .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.row-head{background:var(--surface-2);font-size:.78rem;font-weight:700;color:var(--muted);padding-block:8px}
.row-head:hover{background:var(--surface-2)}
@media (max-width:760px){
  .row{grid-template-columns:58px auto minmax(0,1fr) auto;row-gap:2px}
  .row .c-area{grid-column:3;font-size:.82rem}
  .row .c-note{display:none}
  .row .tags{grid-column:3 / -1;grid-row:auto;flex-direction:row;align-items:center;justify-content:flex-start;margin-top:4px}
  .row .stamp{text-align:right}
  .row-head{display:none}
}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:40}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{font-size:1.1rem;min-width:0;overflow-wrap:anywhere}
.sheet-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-foot{display:flex;gap:8px;justify-content:flex-start;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card + .card{margin-top:12px}
.card h3{font-size:.95rem;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .span{grid-column:1/-1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv div{min-width:0}
.kv dt{font-size:.78rem;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd.empty-v{color:var(--muted);font-weight:400}
.idbox{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;direction:ltr;text-align:right}
.kids{display:flex;flex-direction:column;gap:8px}
.kid{display:grid;grid-template-columns:minmax(0,1.4fr) 90px 80px minmax(0,1.2fr) 60px 36px;gap:6px;align-items:end}
@media (max-width:640px){.kid{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}.kid .x{grid-column:2;justify-self:end}}
.kidlist{display:flex;flex-wrap:wrap;gap:6px}
.kidchip{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.timeline li{display:flex;gap:10px;justify-content:space-between;font-size:.88rem;border-bottom:1px dashed var(--line);padding-bottom:6px}
.timeline li:last-child{border-bottom:0}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{color:var(--accent-strong)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.income{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.income b{font-size:1.1rem}

/* distribution */
.dist{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.drow{display:grid;grid-template-columns:30px 36px minmax(0,2fr) minmax(0,1fr) 120px 170px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow.dhead{background:var(--surface-2);font-size:.78rem;font-weight:700;color:var(--muted);padding-block:8px}
.drow.done{background:var(--ok-soft)}
.drow.picked{background:var(--accent-soft)}
.drow .nm{font-weight:700}
.nmcell{min-width:0;overflow-wrap:anywhere}
.ck{display:grid;place-items:center;cursor:pointer;min-height:32px}
.ck input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.give{min-width:120px;justify-content:center}
.times{display:block;font-size:.78rem;color:var(--ok);font-weight:600}
.gotit{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;color:var(--ok);font-size:.85rem}
.gotit .btn{min-height:28px;padding:2px 8px}
@media (max-width:700px){
  .drow{grid-template-columns:28px minmax(0,1fr) auto;row-gap:4px;column-gap:8px}
  .drow .seq{display:none}
  .drow > :nth-child(3),.drow .c-area,.drow .amt{grid-column:2}
  .drow .c-area{font-size:.82rem}
  .drow .give,.drow .gotit{grid-column:3;grid-row:1/span 3}
  .drow.dhead .c-area,.drow.dhead .amt,.drow.dhead > :nth-child(2){display:none}
  .gotit{flex-direction:column;align-items:flex-end}
}
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--helm-forest);color:#FFFFFF;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.bulkbar .btn.ghost{color:#FFFFFF}
.bulkbar .btn.primary{background:var(--helm-lime);border-color:var(--helm-lime);color:#0F2A1B}
.bulkbar[hidden]{display:none}
body.has-bulk{padding-bottom:110px}
/* matrix */
.mxwrap{overflow:auto;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:75vh}
.mx{font-size:.88rem}
.mx th,.mx td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 8px;text-align:center}
.mx thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;vertical-align:bottom}
.mx th.ac span{display:block;white-space:normal;min-width:62px;max-width:90px;line-height:1.3}
.mx .c1,.mx .c2{position:sticky;background:var(--surface);z-index:1}
.mx .c1{right:0;width:64px;min-width:64px;max-width:64px;color:var(--muted);white-space:nowrap;font-size:.8rem}
.mx .c2{right:64px;text-align:right;min-width:170px;max-width:220px;white-space:normal;box-shadow:-8px 0 8px -8px rgba(0,0,0,.28)}
.mx .c3{white-space:nowrap;color:var(--muted);font-size:.82rem}
.mx thead .c1,.mx thead .c2{z-index:3;background:var(--surface-2)}
.mx tfoot td{background:var(--surface-2);font-weight:700;position:sticky;bottom:0}
.mx tfoot .c1,.mx tfoot .c2{background:var(--surface-2);z-index:2}
.mx td.hit{background:var(--ok-soft);color:var(--ok);font-weight:800}
.mx td.hit small{font-size:.7rem;margin-inline-start:2px}
.mx td.miss{color:var(--rej);opacity:.75}
.mx td.na{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--surface-2) 5px 10px)}
.mx td.tot{font-weight:700}
.mx .lnk{border:0;background:none;padding:0;font-weight:700;text-align:right;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.mx .lnk:hover{text-decoration-color:var(--accent)}
.mx .nk{display:block;font-size:.76rem}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:140px;flex:1 1 140px}
.stat .v{font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.2}
.stat .l{font-size:.8rem;color:var(--muted);font-weight:600}
.progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(to left,var(--helm-deep),var(--helm-leaf),var(--helm-lime))}

/* reports */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.rgrid > *{min-width:0}
.rgrid .wide{grid-column:1/-1}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:700}
tfoot td{font-weight:700;border-bottom:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:.85rem}
.bar .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bar);border-radius:4px}
.bar .val{text-align:left;font-weight:700}

/* settings */
.editlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.editlist .tag{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;padding:3px 4px 3px 10px;color:var(--ink);background:var(--surface-2)}
.editlist .tag button{border:0;background:none;color:var(--muted);padding:0 6px;font-size:1rem;line-height:1}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline > *{flex:1 1 150px}
.inline .btn{flex:0 0 auto}
.group-h{font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 6px}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.confirm{position:fixed;inset:0;display:grid;place-items:center;z-index:70;background:rgba(10,20,14,.5);padding:16px}
.confirm .box{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.confirm .box p{margin:8px 0 16px}


/* settings */
.shead{margin-top:18px}
.shead h2{font-size:1.25rem;color:var(--accent-strong)}
.shead p{margin:4px 0 0;font-size:.9rem;max-width:70ch}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px;margin-top:14px;align-items:start}

/* ---------- Helm design system (tokens) ---------- */
:root{
  --helm-leaf:#2bb673; --helm-deep:#009444; --helm-forest:#006838; --helm-lime:#8dc63f; --helm-sun:#d7df23;
  --bg:#f3faf6; --surface:#ffffff; --surface-2:#e6f4ec; --ink:#13261c; --muted:#4a5d52; --line:#d3e6db;
  --accent:#006838; --accent-strong:#006838; --accent-ink:#ffffff; --accent-soft:#e6f4ec; --bar:#2bb673;
  --ok:#006838; --ok-soft:#eaf6d9; --season:#8a5a00; --season-soft:#fff6dc; --rej:#b42318; --rej-soft:#fdecea; --pend:#4a5d52; --pend-soft:#e6f4ec;
  --warn:#8a5a00; --shadow:0 10px 30px rgba(0,104,56,.16); --shadow-card:0 1px 2px rgba(19,38,28,.06),0 6px 20px rgba(19,38,28,.06);
  --f-display:"Reem Kufi","Cairo",system-ui,sans-serif; --f-body:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:24px; --r-md:14px; --r-sm:8px;

.btn.primary{background:var(--helm-forest);border-color:var(--helm-forest);color:#fff}
.btn.primary:hover{background:#004d29;border-color:#004d29}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{border-radius:var(--r-sm);border-color:#5f7d6c}
.chip,.pill,.tag,.stsel{border-radius:999px}
:focus-visible{outline:2px solid var(--helm-forest);outline-offset:2px}
.card,.ovcard,.stat,.scard{border-radius:var(--r)}
.list,.mxwrap,.empty{border-radius:16px}
.donut .seg-deserve{stroke:var(--helm-leaf)} .legend [data-k=deserve] i{background:var(--helm-leaf)!important}
.abar .t i.deserve{background:var(--helm-leaf)} .abar .t i.season{background:#c89a2e} .abar .t i.pending{background:#8fa69a}
.donut .seg-season{stroke:#c89a2e} .legend [data-k=season] i{background:#c89a2e!important}
.donut .seg-pending{stroke:#8fa69a} .legend [data-k=pending] i{background:#8fa69a!important}
.ring .val{stroke:var(--helm-leaf)}
.authbrand{background:var(--helm-forest)}
.authbrand::after{background:radial-gradient(circle,rgba(141,198,63,.28),transparent 70%)}
.authlogo{border-radius:var(--r)}
.top::after{background:linear-gradient(to left,var(--helm-forest),var(--helm-deep) 30%,var(--helm-leaf) 60%,var(--helm-lime) 85%,var(--helm-sun))}
/* calm motion: 150–200ms, no bounce */
@media (prefers-reduced-motion:no-preference){
  section[id^="view-"]:not([hidden]){animation:mFade .2s ease-out}
  .list.anim .row:not(.row-head){animation:mRow .2s ease-out both;animation-delay:calc(var(--i,0) * 18ms)}
  .anim .stat,.anim .ovcard,.mxwrap.anim td.hit,.confirm .box{animation:mFade .2s ease-out both}
  .anim .bar .t i{animation:mGrow .6s ease-out both}
  .toast{animation:mToast .2s ease-out}
  .bnav .tab[aria-selected="true"] svg,.mark img,.authlogo{animation:none}
  .authform > *,.authbrand li{animation:mFade .2s ease-out both}

/* plain font everywhere */
:root{--f-display:"Noto Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;--f-body:"Noto Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif}
/* floating matrix scroll bar */
.mxwrap{max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px)}
.mxfloat{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px;margin-top:8px;box-shadow:var(--shadow-card,0 6px 20px rgba(19,38,28,.08))}
.mxfloat[hidden]{display:none}
.mxfloat button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:44px;min-height:36px;font-weight:700;font-size:1.05rem;color:var(--accent-strong)}
.mxfloat button:hover{border-color:var(--accent)}
.mxrange{flex:1;min-width:0;width:100%;height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.mxrange::-webkit-slider-runnable-track{height:10px;border-radius:8px;background:var(--surface-2)}
.mxrange::-moz-range-track{height:10px;border-radius:8px;background:var(--surface-2)}
.mxrange::-webkit-slider-thumb{-webkit-appearance:none;width:64px;height:18px;margin-top:-4px;border-radius:9px;background:var(--helm-leaf,#2bb673);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mxrange::-moz-range-thumb{width:64px;height:16px;border-radius:9px;background:var(--helm-leaf,#2bb673);border:2px solid #fff}
@media (max-width:700px){
  .mxwrap{max-height:calc(100vh - 300px);max-height:calc(100dvh - 300px)}
  .mxfloat{bottom:calc(var(--bnav-h) + 8px + env(safe-area-inset-bottom,0px))}
}
/* compact type + area abbreviations */
html{font-size:15px}
body{font-size:14px}
.abbr{max-width:96px;text-transform:uppercase;text-align:center;font-weight:700}
.abbrtag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;background:var(--surface-2);color:var(--accent-strong);border-radius:999px;padding:0 8px;margin-inline-start:4px}
@media (max-width:700px){
  html{font-size:14px}
  body{font-size:13.5px}
  .bnav{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
  .row:not(.row-head){grid-template-columns:42px auto minmax(0,1fr) auto auto;column-gap:6px;padding:9px 10px}
  .row .seq{font-size:.74rem}
  .row > span:nth-child(3){font-size:.9rem}
  .row .c-area{font-size:.74rem;max-width:58px}
  .row .stsel,.row .tags .pill{font-size:.72rem;min-height:28px;padding-inline:5px}
  .kpi .l{white-space:normal;font-size:.74rem;line-height:1.3}
  .kpi .v{font-size:1rem}
  .kpi{gap:8px;padding:10px}
  .ring,.kpi .ic{width:34px;height:34px}
}
/* ---------- workflow: org badges, bell, todo, reason, abbreviations, pdf ---------- */
.orgb{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;line-height:1.6}
.org-helm{background:#eaf6d9;color:#006838}
.org-ishraqat{background:#f6f8c8;color:#4a5a00}
.row .c-org{display:flex;align-items:center}
.bell{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent-strong);flex:none}
.bell svg{width:20px;height:20px}
.bell:hover{border-color:var(--accent)}
.bdot{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--rej);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.notif{position:fixed;z-index:60;width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.notif h3{font-size:.95rem;padding:10px 12px 6px;display:flex;justify-content:space-between;align-items:center}
.notif h3 small{font-weight:500;color:var(--muted);font-size:.75rem}
.notif ul{list-style:none;margin:0;padding:0}
.notif li button{display:block;width:100%;text-align:right;border:0;background:none;padding:10px 12px;border-radius:12px;font-size:.86rem;line-height:1.6}
.notif li button:hover{background:var(--surface-2)}
.notif li.unread button{background:var(--accent-soft)}
.notif li.unread button::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rej);margin-inline-end:6px;vertical-align:middle}
.notif .when{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.notif .none{padding:16px 12px;color:var(--muted);font-size:.86rem}
.todo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:16px;background:#fff6dc;border:1px solid #f0dca8;color:#5c3d00}
.todo b{font-size:1rem}
.todo .muted{color:#7a5a12}
.todo .btn{margin-inline-start:auto}
.todo.info{background:var(--accent-soft);border-color:var(--line);color:var(--ink)}
.reason{margin:-2px 0 10px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:.86rem;line-height:1.7}
input.auto{background:var(--surface-2);color:var(--ink);font-weight:600;border-style:dashed}
.err{display:block;color:var(--rej);font-size:.8rem;font-weight:600;margin-top:3px}
.sadd-area{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:end}
.sadd-area .field{margin:0}
.sadd.sadd-area input[type=text]{flex:none;height:44px;min-height:44px}
.notif [dir=ltr]{white-space:nowrap}
.brand > .inline{flex-wrap:nowrap}
.sadd-area .abbrhint{grid-column:1 / -1;order:3;margin:0;font-size:.82rem;color:var(--muted)}
.abbrf input.abbr{max-width:none;border:2px solid var(--helm-forest);background:#fff;font-size:1.15rem;font-weight:800;letter-spacing:.08em;color:var(--helm-forest)}
.abbrf label{color:var(--helm-forest)}
input.abbr{text-transform:uppercase;text-align:center;font-weight:800}
.srow.editing input.abbr{max-width:90px;border:2px solid var(--helm-forest);font-size:1rem}
.abbrtag{display:inline-block;font-size:.82rem!important;font-weight:800;letter-spacing:.06em;background:var(--helm-forest)!important;color:#fff!important;border-radius:8px!important;padding:1px 10px!important;margin-inline-start:8px;vertical-align:middle}
.abbrtag.none{background:#fff6dc!important;color:#8a5a00!important;letter-spacing:0;font-weight:700}
@media (max-width:700px){
  .sadd-area{grid-template-columns:minmax(0,1fr) 92px}
  .sadd-area > .btn{grid-column:1 / -1}
  .todo{padding:10px 12px;gap:8px;font-size:.86rem}
  .todo .btn{margin-inline-start:0}
  .bell{width:34px;height:34px;border-radius:10px}
  .bell svg{width:18px;height:18px}
  .brand > .inline{flex-wrap:nowrap;gap:6px}
}
.pdfwrap{position:fixed;top:0;left:-20000px;z-index:-1}
.pdfdoc{background:#fff;color:#13261c;font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;font-size:11px;line-height:1.6;padding:4px 14px 4px 14px;box-sizing:border-box;direction:rtl}
.pdfdoc .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #2bb673;padding-bottom:8px;margin-bottom:10px}
.pdfdoc .ph img{width:110px}
.pdfdoc h1{font-size:18px;margin:0;color:#006838}
.pdfdoc .sub{color:#4a5d52;font-size:10.5px}
.pdfdoc table{width:100%;border-collapse:collapse}
.pdfdoc th,.pdfdoc td{border:1px solid #c9ddd1;padding:4px 6px;text-align:right;vertical-align:top}
.pdfdoc th{background:#e6f4ec;font-weight:700}
.pdfdoc tr{page-break-inside:avoid}
.pdfdoc .sec{margin:10px 0 4px;font-size:13px;color:#006838;font-weight:700}
.pdfdoc .kvt td:nth-child(odd){background:#f3faf6;font-weight:700;width:18%}
.pdfdoc .ltr{direction:ltr;unicode-bidi:embed}

  .field label{font-size:.72rem}

}

@media (max-width:700px){
  .drec summary{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLatin = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const num = v => { const n = parseFloat(toLatin(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const fmt = n => Number(n || 0).toLocaleString('ar-EG');
const money = n => fmt(n) + ' ج';
const pad = n => String(n).padStart(2,'0');
const ymOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1);
const curYM = () => ymOf(new Date());
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const ymLabel = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'}); };
const dateLabel = iso => { if(!iso) return ''; const d = new Date(iso.length===10 ? iso+'T12:00:00' : iso); return isNaN(d) ? iso : d.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}); };
const addMonths = (ym, k) => { const [y,m] = ym.split('-').map(Number); return ymOf(new Date(y, m-1+k, 1)); };
const norm = s => toLatin(s).toLowerCase().replace(/[أإآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* National ID as this user may see it. Without access (view-only), the database
   returns only the last 4 digits ("nidMasked"); age/birth then come from birthDate. */
function nidShow(c){ return (c && c.nationalId) || (c && c.nidMasked ? '••••••••••' + c.nidMasked : ''); }
function nidOf(c){
  if(c && c.nationalId) return parseNID(c.nationalId);
  if(c && c.birthDate){ const [y,m,d] = String(c.birthDate).split('-').map(Number); if(y && m && d){ const now = new Date(); let age = now.getFullYear()-y; if(now.getMonth()<m-1 || (now.getMonth()===m-1 && now.getDate()<d)) age--; return {ok:true, masked:true, value:'', birth:c.birthDate, age, gender:c.gender||'', gov:c.birthGov||''}; } }
  return {empty:true};
}
function parseNID(raw){
  const s = toLatin(raw).replace(/\D/g,'');
  if(!s) return {empty:true};
  if(s.length !== 14) return {error:'يجب أن يتكون الرقم القومي من 14 رقمًا (المُدخل ' + s.length + ')'};
  const cent = s[0]==='2' ? 1900 : s[0]==='3' ? 2000 : 0;
  if(!cent) return {error:'يجب أن يبدأ الرقم القومي بالرقم 2 أو 3'};
  const y = cent + +s.slice(1,3), m = +s.slice(3,5), d = +s.slice(5,7);
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return {error:'تاريخ الميلاد المستخرج من الرقم غير صحيح، يُرجى مراجعة الأرقام'};
  const now = new Date(); let age = now.getFullYear()-y; if(now.getMonth()<m-1 || (now.getMonth()===m-1 && now.getDate()<d)) age--;
  return {ok:true, value:s, birth: y+'-'+pad(m)+'-'+pad(d), age, gender: (+s[12])%2 ? 'ذكر' : 'أنثى', gov: GOV[s.slice(7,9)] || 'غير معروفة'};
}

const actById = id => S.settings.activities.find(a => a.id === id);

const legacyCode = c => (c && c.seq && APPROVED(c.category) && !c.createdBy) ? (areaCode(c.area) || 'H') + '-' + String(c.seq).padStart(3,'0') : '';
const codeOf = c => (c && c.code && String(c.code).trim()) || (c && c.statusCode) || legacyCode(c);
function nextCode(c){
  let max = 0; const take = k => { const m = /(\d+)\s*$/.exec(k || ''); if(m) max = Math.max(max, +m[1]); };
  S.cases.forEach(x => take(codeOf(x))); S.status.forEach(st => take(st.code));
  return (areaCode(c.area) || 'H') + '-' + String(max + 1).padStart(3,'0');
}

const REQUIRED = [['idName','الاسم في البطاقة'],['nickname','الاسم المتعارف عليه (الكنية)'],['gender','النوع'],['nationalId','الرقم القومي'],['phone','رقم الهاتف'],['area','المنطقة'],['address','العنوان بالتفصيل'],['maritalStatus','الحالة الاجتماعية'],['job','عمل الحالة'],['sick','هل تعاني من مرض؟']];
function missingOf(c){
  return REQUIRED.filter(([k]) => k==='sick' ? (c.sick!==true && c.sick!==false) : !String(c[k]??'').trim()).map(([,l]) => l);
}
function mergeStatus(id){
  const c = S.cases.get(id); if(!c) return;
  const st = S.status.get(id);
  c.category = st?.category || 'pending';
  c.statusHistory = st?.history || [];
  c.statusBy = st?.by || null; c.statusAt = st?.at || null; c.statusDate = st?.date || null;
  c.statusCode = st?.code || null; c.statusReason = st?.reason || '';
  if(st?.category==='rejected') c.rejectReason = st.reason || c.rejectReason;
}

  const members = 1 + (c.spouseStatus==='alive' ? 1 : 0) + (c.kids||[]).length;
  return {total, members, per: members ? Math.round(total/members) : 0};

function eligible(c, act){
  if(!act) return false;
  if(act.id==='monthly_cash') return !!(c.monthly && c.monthly.active) && c.category!=='rejected';
  if(c.category==='rejected' || c.category==='pending') return false;
  if(act.group==='monthly') return c.category==='deserve';
  return true;
}

/* ---------- UI primitives ---------- */
function toast(msg){
  const r = $('#toastRoot'); r.innerHTML = '<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = '', 2600);
}
function confirmBox(title, text, okLabel='تأكيد', danger=false){
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'confirm';
    el.innerHTML = '<div class="box" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="inline"><button class="btn '+(danger?'danger':'primary')+'" data-ok>'+esc(okLabel)+'</button><button class="btn ghost" data-no>رجوع</button></div></div>';
    document.body.appendChild(el);
    const done = v => { el.remove(); res(v); };
    el.addEventListener('click', e => { if(e.target.closest('[data-ok]')) done(true); else if(e.target.closest('[data-no]') || e.target===el) done(false); });
    $('[data-ok]', el).focus();
  });
}
function catPill(cat){ const c = CATS[cat] || CATS.pending; return '<span class="pill c-'+(CATS[cat]?cat:'pending')+'">'+esc(c.label)+'</span>'; }
async function guard(fn, okMsg){
  if(!S.db){ toast('الحفظ غير متاح في هذا العرض'); return false; }
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    console.warn(e);
    const code = e && e.code;
    if(code==='duplicate') toast('لم يُحفظ: الرقم القومي مسجّل بالفعل لحالة أخرى');
    else if(code==='session') toast('انتهت الجلسة، يُرجى تسجيل الدخول مرة أخرى');
    else if(code==='invalid') toast('بيانات غير صحيحة، يُرجى مراجعة الرقم القومي (14 رقمًا)');
    else if(code==='invalid_argument' || code==='permission') toast('لا تملك صلاحية لهذا الإجراء');
    else if(code==='quota_exceeded') toast('امتلأت المساحة المتاحة، يُرجى حذف بعض السجلات القديمة أولًا');
    else if(code==='resource_exhausted') toast('طلبات كثيرة متتالية، يُرجى الانتظار قليلًا ثم المحاولة مرة أخرى');
    else toast('تعذّر الحفظ، يُرجى المحاولة مرة أخرى');
    return false;
  }
}

/* ---------- cases view ---------- */
function filteredCases(){
  const f = S.filter, q = norm(f.q);
  return sortedCases().filter(c => {
    if(f.cat!=='all' && c.category!==f.cat) return false;
    if(f.area!=='all' && (c.area||'')!==(f.area==='__none'?'':f.area)) return false;
    if(f.org!=='all' && (ORGS[c.org] ? c.org : '__none')!==f.org) return false;
    if(f.missing && !missingOf(c).length) return false;
    if(f.monthly && !(c.monthly && c.monthly.active)) return false;
    if(q){
      const hay = norm([c.idName,c.nickname,c.nationalId,c.phone,c.phone2,c.address,c.notes,c.seq,codeOf(c)].join(' '));
      if(!q.split(' ').every(w => hay.includes(w))) return false;
    }
    return true;
  });
}
function renderCases(){
  const v = $('#view-cases'); const all = sortedCases(); const f = S.filter;
  const counts = {all:all.length}; CAT_ORDER.forEach(k => counts[k] = all.filter(c => c.category===k).length);
  const missingN = all.filter(c => missingOf(c).length).length;
  const monthlyN = all.filter(c => c.monthly && c.monthly.active).length;
  const areas = S.settings.areas;
  if(!v.dataset.built){
    v.innerHTML = `
      <div id="ovPanel"></div>
      <div class="toolbar">
        <div class="field grow"><label for="q">بحث</label><input id="q" type="search" placeholder="الاسم، الكنية، الرقم القومي، رقم الهاتف…" autocomplete="off"></div>

        <div class="field"><label for="fOrg">الجهة</label><select id="fOrg"><option value="all">حلم وإشراقات</option>${Object.entries(ORGS).map(([k,o]) => '<option value="'+k+'">'+o.label+'</option>').join('')}<option value="__none">غير محددة</option></select></div>
        <button class="btn" id="expCases" type="button">تحميل Excel (CSV)</button>
        <button class="btn" id="pdfCases" type="button">تحميل PDF</button>
      </div>
      <div class="chips" id="catChips"></div>
      <div id="caseList"></div>`;
    v.dataset.built = '1';
    $('#q').addEventListener('input', e => { S.filter.q = e.target.value; drawList(); });
    $('#fArea').addEventListener('change', e => { S.filter.area = e.target.value; drawList(); });
    $('#fOrg').addEventListener('change', e => { S.filter.org = e.target.value; drawList(); });
    $('#catChips').addEventListener('click', e => {
      const b = e.target.closest('[data-cat],[data-flag]'); if(!b) return;
      if(b.dataset.cat) S.filter.cat = b.dataset.cat; else S.filter[b.dataset.flag] = !S.filter[b.dataset.flag];
      renderCases();
    });
    $('#expCases').addEventListener('click', exportCases);
    $('#pdfCases').addEventListener('click', pdfCases);
  }
  $('#fArea').innerHTML = '<option value="all">كل المناطق</option>' + areas.map(a => '<option'+(f.area===a?' selected':'')+'>'+esc(a)+'</option>').join('') + '<option value="__none"'+(f.area==='__none'?' selected':'')+'>بدون منطقة</option>';
  $('#catChips').innerHTML =
    '<button class="chip" data-cat="all" aria-pressed="'+(f.cat==='all')+'">الكل<span class="n num">'+fmt(counts.all)+'</span></button>' +
    CAT_ORDER.map(k => '<button class="chip" data-cat="'+k+'" aria-pressed="'+(f.cat===k)+'">'+CATS[k].label+'<span class="n num">'+fmt(counts[k])+'</span></button>').join('') +
    '<button class="chip" data-flag="monthly" aria-pressed="'+f.monthly+'">مكفولة شهريًا<span class="n num">'+fmt(monthlyN)+'</span></button>' +
    '<button class="chip" data-flag="missing" aria-pressed="'+f.missing+'">بيانات ناقصة<span class="n num">'+fmt(missingN)+'</span></button>';
  drawList();
}

      return '<div class="row" data-id="'+esc(c.id)+'" tabindex="0" role="button">' +

        '<span><span class="nm">'+esc(c.idName||'بدون اسم')+'</span>'+(c.nickname?' <span class="nick">('+esc(c.nickname)+')</span>':'')+'</span>' +

        '<span class="meta c-note">'+esc(status)+'</span>' +
        '<span class="tags"><span>'+stCtl+stamp+'</span>'+(c.monthly&&c.monthly.active?'<span class="tag num">شهرية '+money(c.monthly.amount)+'</span>':'')+(miss.length?'<span class="tag warn" title="بيانات ناقصة: '+esc(miss.join('، '))+'">نواقص '+fmt(miss.length)+'</span>':'')+'</span>' +

    }).join('') + '</div>';
  $$('.row[data-id]', box).forEach(r => {
    r.addEventListener('click', e => { if(e.target.closest('select')) return; openCase(r.dataset.id); });

async function loadHistory(c){
  const box = $('#delHist'); if(!box) return;
  let rows = [...S.deliveries.values()].filter(d => d.caseId===c.id);
  if(S.db){
    try{ const snap = await S.db.collection('deliveries').where('caseId','==',c.id).get(); rows = snap.docs.map(d => ({id:d.id, ...d.data()})); }catch(e){}
  }
  if(!$('#delHist') || S.open?.id!==c.id) return;
  rows.sort((a,b) => (b.period||'').localeCompare(a.period||'') || (b.date||'').localeCompare(a.date||''));
  if(!rows.length){ box.innerHTML = '<p class="muted" style="margin:0">لا توجد مساعدات مستلمة مسجلة.</p>'; return; }
  const total = rows.reduce((s,d) => s + num(d.amount), 0);
  box.innerHTML = '<div class="tblwrap"><table><thead><tr><th>الشهر</th><th>النشاط</th><th>المبلغ / الكمية</th><th>تاريخ الاستلام</th><th></th></tr></thead><tbody>' +
    rows.map(d => '<tr><td>'+esc(ymLabel(d.period))+'</td><td>'+esc(actById(d.activityId)?.name || d.activityName || d.activityId)+'</td><td class="num">'+(d.amount?money(d.amount):'')+(d.qty?' '+fmt(d.qty)+' قطعة':'')+'</td><td class="num">'+esc(dateLabel(d.date))+'</td><td>'+(S.canWrite?'<button class="btn sm ghost" data-undo="'+esc(d.id)+'" type="button">إلغاء</button>':'')+'</td></tr>').join('') +
    '</tbody>'+(total?'<tfoot><tr><td colspan="2">إجمالي المبالغ</td><td class="num">'+money(total)+'</td><td colspan="2"></td></tr></tfoot>':'')+'</table></div>';
  $$('[data-undo]', box).forEach(b => b.addEventListener('click', async () => {
    if(await confirmBox('إلغاء الاستلام؟', 'سيُحذف هذا الاستلام من سجل الحالة.', 'إلغاء الاستلام', true)){
      if(await guard(() => S.db.doc('deliveries/'+b.dataset.undo).delete(), 'تم إلغاء الاستلام')) loadHistory(c);
    }
  }));
}

function statusDialog(id, preset){
  const c = S.cases.get(id); if(!c) return;
  if(!S.canApprove){ toast('تغيير الاستحقاق متاح للمعتمِد والمسؤول فقط'); return; }
  const pick = preset || c.category;
  const el = document.createElement('div'); el.className = 'confirm';
  el.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="stTitle" style="max-width:520px">
    <h3 id="stTitle">تحديث الاستحقاق</h3>
    <p class="muted" style="margin:4px 0 14px">الحالة: ${esc(c.idName)} · التصنيف الحالي ${catPill(c.category)}</p>
    <div class="field"><label>القرار الجديد</label>
      <div class="seg">${CAT_ORDER.map(k => '<label><input type="radio" name="stCat" value="'+k+'"'+(pick===k?' checked':'')+'><span>'+CATS[k].label+(c.category===k?' (تأكيد)':'')+'</span></label>').join('')}</div></div>
    <p class="muted" style="margin:10px 0 0;font-size:.82rem">سيُسجَّل القرار باسمك (${esc(nameOf(S.uid))}) مع التاريخ والوقت.</p>
    <div class="grid" style="margin-top:12px">
      <div class="field"><label for="stDate">تاريخ القرار *</label><input id="stDate" type="date" value="${todayISO()}"></div>
      ${codeOf(c) ? '' : '<p class="muted span" style="margin:0;font-size:.82rem">عند اختيار "تستحق" أو "مواسم" يُنشأ كود الحالة تلقائيًا. الحالات المرفوضة لا تأخذ كودًا.</p>'}
      <div class="field span"><label for="stReason">سبب القرار * <span class="muted" style="font-weight:500">(يظهر للباحث وفي ملف الحالة)</span></label><textarea id="stReason" placeholder="مثال: إعادة البحث الاجتماعي أظهرت وجود معاش جديد"></textarea></div>
    </div>
    <p class="err" id="stErr" role="alert" style="color:var(--rej);font-weight:600;min-height:1.2em;margin:8px 0"></p>
    <div class="inline"><button class="btn primary" id="stSave" type="button">حفظ التحديث</button><button class="btn ghost" id="stCancel" type="button">إلغاء</button></div>
  </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  $('#stCancel', el).addEventListener('click', close);
  el.addEventListener('click', e => { if(e.target===el) close(); });
  $('#stReason', el).focus();
  $('#stSave', el).addEventListener('click', async () => {
    const to = $('input[name=stCat]:checked', el)?.value, date = $('#stDate', el).value, reason = $('#stReason', el).value.trim(), err = $('#stErr', el);
    if(!to){ err.textContent = 'يُرجى اختيار القرار.'; return; }
    if(!date){ err.textContent = 'يُرجى إدخال تاريخ القرار.'; $('#stDate', el).focus(); return; }
    if(!reason){ err.textContent = 'يُرجى كتابة سبب القرار.'; $('#stReason', el).focus(); return; }
    const nowISO = new Date().toISOString(), from = c.category;
    const entry = {date, from, to, reason, by:S.uid, at:nowISO};
    const hist = [...(c.statusHistory||[]), entry].slice(-100);
    const keep = c.statusCode || (c.code && String(c.code).trim()) || legacyCode(c);
    const code = keep || (APPROVED(to) ? nextCode(c) : null);
    const stDoc = {category:to, by:S.uid, at:nowISO, date, reason, history:hist, code: code || null};
    $('#stSave', el).disabled = true;
    const ok = await guard(() => S.db.doc('status/'+id).set(stDoc), (!keep && code) ? 'تم الحفظ، وكود الحالة: ' + code : 'تم حفظ الاستحقاق');
    if(ok){ S.status.set(id, stDoc); mergeStatus(id); close(); if(S.open?.mode==='view' && S.open.id===id) openCase(id); renderAll(); }
    else $('#stSave', el).disabled = false;
  });
}

    let dup = [...S.cases.values()].find(x => x.nationalId===r.value && x.id!==id);
    if(!dup && S.nidOthers && [...S.nidOthers].some(([k, v]) => v === r.value && k !== id)) dup = {idName:''};
    if(!dup && S.nidTaken === r.value) dup = {idName:''};
    if(dup){ el.textContent = '⚠ هذا الرقم القومي موجود بالفعل في السجل' + (dup.idName ? ' باسم "'+dup.idName+'"'+(codeOf(dup) ? ' (كود '+codeOf(dup)+')' : '')+(dup.area?' في '+dup.area:'') : ' لحالة سجّلها عضو آخر') + '. لن تُحفظ الحالة إلا بعد تصحيح الرقم.'; el.style.color='var(--rej)'; el.classList.add('nid-dup'); $('#f_nid').classList.add('filled-err'); return {error:'dup', dup}; }
    el.classList.remove('nid-dup'); $('#f_nid').classList.remove('filled-err');
    if(S.nidChecked !== r.value && typeof sb !== 'undefined' && sb && sb.rpc){ S.nidChecked = r.value; sb.rpc('cases_nid_taken', {p_nid: r.value, p_id: id || ''}).then(({data}) => { if(data === true){ S.nidTaken = r.value; if($('#f_nid') && parseNID($('#f_nid').value).value === r.value) nidInfo(); } }, () => {}); }
    el.textContent = 'رقم صحيح: '+r.gender+' · '+r.gov; el.style.color='var(--ok)'; return r;
  };
  const nidDerived = () => {
    const r = parseNID($('#f_nid').value);
    $('#f_birth').value = r.ok ? dateLabel(r.birth) : ''; $('#f_age').value = r.ok ? fmt(r.age) + ' سنة' : ''; $('#f_gov').value = r.ok ? r.gov : '';
    const g = $('#f_gender'), bad = r.ok && g.value && g.value !== r.gender;
    let m = $('#genderErr'); if(!m){ m = document.createElement('span'); m.id = 'genderErr'; m.className = 'err'; g.after(m); }
    m.textContent = bad ? 'النوع لا يطابق الرقم القومي (الرقم يخص ' + r.gender + ')' : '';

  nidInfo(); nidDerived();
  const scan = wireIdScan(c, formDocId, nidInfo);
  $('#f_nid').addEventListener('input', () => { const r = nidInfo(); if(r && r.ok && !$('#f_gender').value) $('#f_gender').value = r.gender==='ذكر' ? 'ذكر' : 'أنثى'; nidDerived(); });
  $('#f_gender').addEventListener('change', nidDerived);

  $('#saveCase').addEventListener('click', async () => {

    const codeV = ($('#f_code')?.value || '').trim();
    if(codeV && [...S.cases.values()].some(x => x.id !== id && codeOf(x).toLowerCase() === codeV.toLowerCase())){ err.textContent = 'كود الحالة "'+codeV+'" مستخدم لحالة أخرى.'; $('#f_code').focus(); return; }
    const idName = $('#f_idName').value.trim();
    const reqMap = [['#f_org','الحالة تبع (حلم أو إشراقات)'],['#f_idName','الاسم في البطاقة'],['#f_nick','الاسم المتعارف عليه (الكنية)'],['#f_gender','النوع'],['#f_nid','الرقم القومي'],['#f_phone','رقم الهاتف'],['#f_area','المنطقة'],['#f_addr','العنوان بالتفصيل'],['#f_marital','الحالة الاجتماعية'],['#f_job','عمل الحالة'],['#f_sick','هل تعاني من مرض؟']];
    $$('#caseForm .filled-err').forEach(x => x.classList.remove('filled-err'));
    const missing = reqMap.filter(([sel]) => !String($(sel).value||'').trim());
    if(missing.length){
      missing.forEach(([sel]) => { $(sel).style.borderColor = 'var(--rej)'; $(sel).addEventListener('input', () => $(sel).style.borderColor = '', {once:true}); $(sel).addEventListener('change', () => $(sel).style.borderColor = '', {once:true}); });
      err.textContent = 'يُرجى استكمال الحقول الإلزامية: ' + missing.map(([,l]) => l).join('، ') + '.';
      $(missing[0][0]).focus(); return;
    }
    const r = nidInfo();
    if(r.error==='dup'){ err.textContent = 'لم تُحفظ الحالة: الرقم القومي موجود بالفعل في السجل' + (r.dup.idName ? ' للحالة "'+r.dup.idName+'"' : '') + '. صحّح الرقم أو افتح الحالة الموجودة بدلًا من تسجيلها مرتين.'; $('#f_nid').focus(); return; }
    if(r.error){ err.textContent = r.error; $('#f_nid').focus(); return; }
    if($('#f_mAct').checked){
      if(!$('#f_mDonor').value){ err.textContent = 'يُرجى اختيار المتبرع للكفالة الشهرية.'; $('#f_mDonor').focus(); return; }
      if(!(num($('#f_mAmt').value) > 0)){ err.textContent = 'يُرجى كتابة مبلغ الكفالة الشهري (رقم أكبر من صفر).'; $('#f_mAmt').focus(); return; }
    }
    if(r.ok && $('#f_gender').value && $('#f_gender').value !== r.gender){ err.textContent = 'النوع المختار ('+$('#f_gender').value+') لا يطابق الرقم القومي الذي يخص '+r.gender+'. يُرجى مراجعة النوع أو الرقم.'; $('#f_gender').focus(); return; }
    const cat = id ? (c.category || 'pending') : 'pending';
    const sick = $('#f_sick').value;
    const kids = $$('[data-kid]').map(row => {
      const o = {}; $$('[data-k]', row).forEach(i => o[i.dataset.k] = i.value.trim());
      o.age = o.age ? num(o.age) : null; o.grade = o.grade ? num(o.grade) : null; return o;
    }).filter(k => k.name || k.gender || k.age || k.stage);
    const nowISO = new Date().toISOString();
    const data = {
      ...c,
      idName, nickname:$('#f_nick').value.trim(), gender:$('#f_gender').value, nationalId: r.ok ? r.value : '', birthDate: r.ok ? r.birth : '', birthGov: r.ok ? r.gov : '',
      phone:toLatin($('#f_phone').value.trim()), phone2:toLatin($('#f_phone2').value.trim()), area:$('#f_area').value, address:$('#f_addr').value.trim(),
      maritalStatus:$('#f_marital').value, job:$('#f_job').value.trim(), sick: sick==='yes' ? true : sick==='no' ? false : null, illness:$('#f_ill').value.trim(),
      spouseName:$('#f_spName').value.trim(), spouseStatus: /متزوج/.test($('#f_marital').value) ? 'alive' : (c.spouseStatus === 'alive' ? '' : (c.spouseStatus || '')), spouseJob:$('#f_spJob').value.trim(),
      kids,
      pension:num($('#f_pension').value)||null, pensionSource:$('#f_pSrc').value.trim(), caseIncome:num($('#f_cInc').value)||null, otherIncome:num($('#f_oInc').value)||null,
      incomeSource:$('#f_iSrc').value.trim(), housing:$('#f_house').value, rent:num($('#f_rent').value)||null,
      monthly: $('#f_mAct').checked ? monthlyFromForm(m) : {...(c.monthly||{}), active:false},
      code: $('#f_code') ? $('#f_code').value.trim() : (c.code||''), org:$('#f_org').value, researcher:$('#f_res').value.trim(), researcherId: c.researcherId || (c.researcher ? null : S.uid) || null, researchDate:$('#f_resD').value, notes:$('#f_notes').value.trim(), otherComments:c.otherComments||'',
      updatedAt:nowISO, updatedBy:S.uid,
      ...scan.fields()
    };
    delete data.id;
    ['category','statusHistory','statusBy','statusAt','statusDate','spouseSalary'].forEach(k => delete data[k]);
    const log = [...(c.log||[])];
    if(!id){
      data.createdAt = nowISO; data.createdBy = S.uid;
      data.seq = Math.max(0, ...[...S.cases.values()].map(x => x.seq||0)) + 1;
      log.push({at:nowISO, by:S.uid, text:'تم تسجيل الحالة (تحت البحث)'});
    } else {
      const om = c.monthly||{}, nm = data.monthly;
      if(!!om.active !== !!nm.active) log.push({at:nowISO, by:S.uid, text: nm.active ? 'بدأت الكفالة الشهرية '+money(nm.amount) : 'توقفت الكفالة الشهرية'});
      else if(nm.active && num(om.amount)!==num(nm.amount)) log.push({at:nowISO, by:S.uid, text:'تغيّر مبلغ الكفالة من '+money(om.amount)+' إلى '+money(nm.amount)});
    }
    data.log = log.slice(-60);
    const docId = formDocId;
    $('#saveCase').disabled = true;
    const ok = await guard(() => S.db.doc('cases/'+docId).set(data), id ? 'تم حفظ التعديلات' : 'تم تسجيل الحالة');
    $('#saveCase') && ($('#saveCase').disabled = false);
    if(ok){ S.cases.set(docId, {id:docId, ...data}); mergeStatus(docId); openCase(docId); renderAll(); }
  });
}

/* ---------- distribution ---------- */
const sel = new Set();
function renderDist(){
  const v = $('#view-dist'), D = S.dist;
  const act = actById(D.act) || S.settings.activities[0]; if(act) D.act = act.id;
  if(!v.dataset.built){
    v.innerHTML = `
      <div class="toolbar">
        <div class="field"><label for="dsAct">النشاط</label><select id="dsAct"></select></div>
        <div class="field"><label for="dsYm">عن شهر</label><input id="dsYm" type="month"></div>
        <div class="field"><label for="dsDate">تاريخ الاستلام</label><input id="dsDate" type="date"></div>
        <div class="field"><label for="dsArea">المنطقة</label><select id="dsArea"></select></div>
        <div class="field"><label for="dsOrg">الجهة</label><select id="dsOrg"><option value="all">حلم وإشراقات</option>${Object.entries(ORGS).map(([k,o]) => '<option value="'+k+'">'+o.label+'</option>').join('')}</select></div>
        <div class="field grow"><label for="dsQ">بحث</label><input id="dsQ" type="search" placeholder="اسم أو كنية…"></div>
      </div>
      <div class="chips" id="dsChips"></div>
      <div id="dsSug"></div>
      <p class="muted" id="dsDaily" style="font-size:.85rem;margin:8px 0 0" hidden>هذا النشاط متكرر خلال الشهر: يُسجَّل كل تاريخ استلام على حدة. يُرجى تغيير "تاريخ الاستلام" لكل يوم توزيع.</p>
      <div class="summary" id="dsSum"></div>
      <div id="dsList"></div>
      <div class="inline section" id="dsExp"></div>
      <div class="bulkbar" id="bulk" hidden></div>`;
    v.dataset.built = '1';
    $('#dsAct').addEventListener('change', e => { D.act = e.target.value; if(actById(D.act)?.daily) D.ym = (D.date||todayISO()).slice(0,7); sel.clear(); renderDist(); });
    $('#dsYm').addEventListener('change', e => { D.ym = e.target.value || curYM(); sel.clear(); ensurePeriod(D.ym); renderDist(); });
    $('#dsDate').addEventListener('change', e => { D.date = e.target.value || todayISO(); if(actById(D.act)?.daily){ D.ym = D.date.slice(0,7); ensurePeriod(D.ym); } sel.clear(); renderDist(); });
    $('#dsArea').addEventListener('change', e => { D.area = e.target.value; renderDist(); });
    $('#dsOrg').addEventListener('change', e => { D.org = e.target.value; sel.clear(); renderDist(); });
    $('#dsQ').addEventListener('input', e => { D.q = e.target.value; drawDist(); });
    $('#dsChips').addEventListener('click', e => {
      const b = e.target.closest('[data-st]'); if(b){ D.status = b.dataset.st; drawDist(); }
    });
    $('#dsChips').addEventListener('change', e => { if(e.target.id==='dsAll'){ D.all = e.target.checked; drawDist(); } });
  }
  $('#dsAct').innerHTML = actOptions(D.act);
  $('#dsYm').value = D.ym;
  $('#dsDate').value = D.date || todayISO();
  $('#dsDaily').hidden = !actById(D.act)?.daily;
  $('#dsArea').innerHTML = '<option value="all">كل المناطق</option>' + S.settings.areas.map(a => '<option'+(D.area===a?' selected':'')+'>'+esc(a)+'</option>').join('');
  drawDist();
}
function distRows(){
  const D = S.dist, act = actById(D.act);
  return sortedCases().filter(c => ((D.all && act.id!=='monthly_cash') ? c.category!=='rejected' : eligible(c, act)) && (D.area==='all' || c.area===D.area) && (!D.org || D.org==='all' || c.org===D.org));
}
function distShown(){
  const D = S.dist, act = actById(D.act), q = norm(D.q);
  const isDone = c => S.deliveries.has(distKey(c.id));
  let shown = distRows();
  if(q) shown = shown.filter(c => norm(c.idName+' '+(c.nickname||'')+' '+(c.nationalId||'')).includes(q));
  if(D.status==='done') shown = shown.filter(isDone); else if(D.status==='todo') shown = shown.filter(c => !isDone(c));
  return shown;
}
function drawDist(){
  const D = S.dist, act = actById(D.act); if(!act) return;
  const rows = distRows();

function drawBulk(){
  const bar = $('#bulk'); if(!bar) return;

  $('#bulkGo').addEventListener('click', () => giveMany([...sel]));
  $('#bulkClear').addEventListener('click', () => { sel.clear(); drawDist(); });

let giving = false;
async function giveMany(ids){
  if(giving || !ids.length) return;
  if(!S.db){ toast('الحفظ غير متاح في هذا العرض'); return; }
  const D = S.dist, act = actById(D.act), date = D.date || todayISO();
  giving = true; const go = $('#bulkGo'); if(go){ go.disabled = true; go.textContent = 'جارٍ التسجيل…'; }
  let ok = 0;
  try{
    for(let i = 0; i < ids.length; i += 5){
      const chunk = ids.slice(i, i+5);
      const res = await Promise.all(chunk.map(async cid => {
        const key = distKey(cid), c = S.cases.get(cid);
        if(S.deliveries.has(key)) return true;
        const row = $('.drow[data-id="'+CSS.escape(cid)+'"]');
        const amt = act.money ? (num(row && $('[data-amt]', row)?.value) || num(act.id==='monthly_cash' ? c?.monthly?.amount : 0) || null) : null;
        const doc = {caseId:cid, activityId:act.id, period:D.ym, date, amount:amt, qty:null, note:'', by:S.uid, at:new Date().toISOString(), area:c?.area||''};
        try { await S.db.doc('deliveries/'+key).set(doc); S.deliveries.set(key, {id:key, ...doc}); sel.delete(cid); ok++; return true; }
        catch(e){ await guard(() => Promise.reject(e)); return false; }
      }));
      if(res.includes(false)) break;
    }
  } finally {
    giving = false;
    if(ok) toast(ok===1 ? 'تم تسجيل الاستلام' : 'تم تسجيل '+fmt(ok)+' حالة استلام');
    drawDist();
  }
}
async function undoGive(cid){
  const D = S.dist, act = actById(D.act), key = distKey(cid), c = S.cases.get(cid);
  if(!(await confirmBox('إلغاء الاستلام؟', 'سيُحذف تسجيل "'+act.name+'" للحالة '+(c?.idName||'')+' عن '+ymLabel(D.ym)+'.', 'إلغاء الاستلام', true))) return;
  if(await guard(() => S.db.doc('deliveries/'+key).delete(), 'تم إلغاء الاستلام')){ S.deliveries.delete(key); drawDist(); }
}

function matrixData(){
  const M = S.mx;
  const acts = S.settings.activities.filter(a => M.group==='all' || a.group===M.group);
  const byCase = new Map();
  for(const d of S.deliveries.values()){
    if(d.period < M.from || d.period > M.to) continue;
    let m = byCase.get(d.caseId); if(!m){ m = {}; byCase.set(d.caseId, m); }
    (m[d.activityId] = m[d.activityId] || []).push(d);
  }
  const q = norm(M.q);
  let cases = sortedCases().filter(c => (M.cat==='active' || M.cat==='pending' ? APPROVED(c.category) : c.category===M.cat) && (M.area==='all' || c.area===M.area));
  if(q) cases = cases.filter(c => norm(c.idName+' '+(c.nickname||'')).includes(q));
  const missAct = M.miss ? actById(M.miss) : null;
  if(missAct) cases = cases.filter(c => eligible(c, missAct) && !(byCase.get(c.id)?.[missAct.id]));
  return {acts, byCase, cases, missAct};
}

  const tookAny = cases.filter(c => byCase.has(c.id)).length;
  $('#mxNote').innerHTML = '<div class="summary">' +
    (missAct
      ? '<div class="stat"><div class="l">لم تستلم "'+esc(missAct.name)+'" · '+esc(range)+'</div><div class="v num">'+fmt(cases.length)+' أسرة</div></div>'

    '</div>' + (missAct && cases.length && S.canWrite ? '<p style="margin:10px 0 0"><button class="btn primary" id="mxGo" type="button">الانتقال لتسجيل "'+esc(missAct.name)+'" لهذه الأسر</button></p>' : '');
  const go = $('#mxGo'); if(go) go.addEventListener('click', () => { S.dist.act = missAct.id; S.dist.status = 'todo'; S.dist.area = M.area; S.dist.ym = M.to > curYM() ? curYM() : M.to; setTab('dist'); });
  const box = $('#mxBox');
  if(!cases.length){ box.innerHTML = '<div class="empty section"><h3>'+(missAct ? 'استلمت جميع الأسر المستحقة "'+esc(missAct.name)+'" خلال هذه الفترة' : 'لا توجد أسر مطابقة لعوامل التصفية')+'</h3></div>'; return; }
  const colCount = acts.map(a => cases.filter(c => byCase.get(c.id)?.[a.id]).length);
  box.innerHTML = '<div class="mxwrap"><table class="mx"><thead><tr><th class="c1">كود</th><th class="c2">الاسم</th><th class="c3">المنطقة</th>' + acts.map(a => '<th class="ac" title="'+esc(GROUPS[a.group])+'"><span>'+esc(a.name)+'</span></th>').join('') + '<th>عدد الأنشطة</th><th>المبالغ</th></tr></thead><tbody>' +
    cases.map(c => {
      const m = byCase.get(c.id) || {};

        if(list){ n++; list.forEach(d => cash += num(d.amount)); const tip = list.map(d => ymLabel(d.period)+(d.date?' · '+dateLabel(d.date):'')+(d.amount?' · '+money(d.amount):'')).join('\n'); return '<td class="hit" title="'+esc(tip)+'">✓'+(list.length>1?'<small class="num">×'+fmt(list.length)+'</small>':'')+'</td>'; }
        return eligible(c, a) ? '<td class="miss" title="لم تستلم">—</td>' : '<td class="na" title="غير مستحقة لهذا النشاط"></td>';
      }).join('');
      return '<tr><td class="c1 num" dir="ltr">'+esc(codeOf(c)||'—')+'</td><td class="c2"><button class="lnk" type="button" data-open="'+esc(c.id)+'">'+esc(c.idName)+'</button>'+(c.nickname?'<span class="muted nk">'+esc(c.nickname)+'</span>':'')+'</td><td class="c3">'+esc(c.area||'—')+'</td>'+cells+'<td class="num tot">'+fmt(n)+'</td><td class="num tot">'+(cash?money(cash):'')+'</td></tr>';
    }).join('') +

    '<p class="muted" style="font-size:.8rem;margin-top:8px">✓ تم الاستلام (×3 تعني الاستلام 3 مرات خلال الفترة) · — مستحقة ولم تستلم · الخانة المظللة = غير مستحقة لهذا النشاط. اضغط على اسم الأسرة لفتح ملفها.</p>';
  $$('[data-open]', box).forEach(b => b.addEventListener('click', () => openCase(b.dataset.open)));

function exportMatrix(){
  const M = S.mx, {acts, byCase, cases} = matrixData();
  const head = ['كود الحالة','الاسم في البطاقة','الكنية','المنطقة','التصنيف', ...acts.map(a => a.name), 'عدد الأنشطة', 'المبالغ'];
  const rows = cases.map(c => { const m = byCase.get(c.id) || {}; let n = 0, cash = 0;
    const cells = acts.map(a => { const l = m[a.id]; if(l){ n++; l.forEach(d => cash += num(d.amount)); return l.length > 1 ? 'استلمت ×'+l.length : 'استلمت'; } return eligible(c,a) ? 'لم تستلم' : ''; });
    return [codeOf(c), c.idName, c.nickname, c.area, CATS[c.category]?.label, ...cells, n, cash||'']; });
  save('سجل-الاستفادة-'+M.from+'-'+M.to+'.csv', toCsv([head, ...rows]));
}

async function imageToJpegBase64(file, max = 1800){
  let bmp = null;
  try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); } catch(e){}
  let w, h, src;
  if(bmp){ w = bmp.width; h = bmp.height; src = bmp; }
  else {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const k = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.88));
  const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
  return b64;
}

/* parse OCR text of an Egyptian national ID card */
const HEADER_RE = /جمهوري|مصر\s*العربي|بطاق|تحقيق|الشخصي|الرقم\s*القومي|وزارة|الداخلي|الأحوال|المدني|محافظة\s*$/;
const BACK_KEY_RE = /ذكر|أنثى|انثى|مسلم|مسيحي|قبطي|سارية|حتى|متزوج|أرمل|ارمل|مطلق|أعزب|اعزب|آنسة|انسة|عزباء|الديانة|النوع|الحالة/;
const arabicCount = s => (s.match(/[ء-ي]/g) || []).length;
function cleanLines(text){
  return String(text || '').replace(/\r/g, '').split('\n').map(l => l.replace(/[|_•·]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(l => l && l !== '﻿');
}
function findNID(text){
  const flat = toLatin(text).replace(/(\d)[\s\-.]+(?=\d)/g, '$1');
  const runs = flat.match(/\d{14,}/g) || [];
  for(const r of runs){ for(let i = 0; i + 14 <= r.length; i++){ const p = parseNID(r.slice(i, i + 14)); if(p.ok) return p; } }
  return null;
}
function parseFront(text){
  const out = {};
  const nid = findNID(text); if(nid) out.nationalId = nid.value;
  const lines = cleanLines(text).filter(l => !HEADER_RE.test(l) && arabicCount(l) >= 2);
  const nameLines = [], addr = [];
  for(const l of lines){
    const digits = (toLatin(l).match(/\d/g) || []).length;
    if(nameLines.length < 2 && !digits && !addr.length && l.split(' ').length <= 6){ nameLines.push(l); continue; }
    if(digits > 10) continue;
    if(addr.length < 3) addr.push(l);
  }
  if(nameLines.length){
    const first = nameLines[0];
    out.idName = (first.split(' ').length >= 3 || nameLines.length === 1) ? first : (first + ' ' + nameLines[1]);
    if(first.split(' ').length >= 3 && nameLines[1]) addr.unshift(nameLines[1]);
  }
  if(addr.length) out.address = addr.join(' - ');
  const a = norm(out.address || '');
  const area = S.settings.areas.find(x => a.includes(norm(x)));
  if(area) out.area = area;
  return out;
}
function parseBack(text){
  const out = {};
  const t = text || '';
  if(/أرمل|ارمل/.test(t)) out.maritalStatus = 'أرمل/ة';
  else if(/مطلق/.test(t)) out.maritalStatus = 'مطلق/ة';
  else if(/متزوج/.test(t)) out.maritalStatus = 'متزوج/ة';
  else if(/أعزب|اعزب|آنسة|انسة|عزباء/.test(t)) out.maritalStatus = 'لم يسبق له/ا الزواج';
  const exp = toLatin(t).match(/سارية\s*حتى\s*[:：]?\s*(\d{1,4}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{1,4})/);
  if(exp) out.idExpiry = exp[1].replace(/\s+/g, '');
  const lines = cleanLines(t).filter(l => !HEADER_RE.test(l) && arabicCount(l) >= 2 && !(toLatin(l).match(/\d/g) || []).length);
  const free = lines.filter(l => !BACK_KEY_RE.test(l));
  if(free[0]) out.job = free[0];
  if(out.maritalStatus === 'متزوج/ة' || out.maritalStatus === 'أرمل/ة'){
    const all = cleanLines(t);
    const i = all.findIndex(l => /متزوج|أرمل|ارمل/.test(l));
    const cand = all.slice(i + 1).find(l => arabicCount(l) >= 4 && !BACK_KEY_RE.test(l) && !HEADER_RE.test(l) && !(toLatin(l).match(/\d/g) || []).length && l !== out.job);

const AI_MARITAL = {married:'متزوج/ة', widowed:'أرمل/ة', divorced:'مطلق/ة', single:'لم يسبق له/ا الزواج'};
function aiToParsed(side, f){
  const out = {};

  const nid = f.national_id ? parseNID(f.national_id) : null;
  if(nid && nid.ok) out.nationalId = nid.value;
  if(f.full_name) out.idName = String(f.full_name).replace(/\s+/g, ' ').trim();
  if(f.address){ out.address = String(f.address).trim(); const a = norm(out.address); const area = S.settings.areas.find(x => a.includes(norm(x))); if(area) out.area = area; }
  if(AI_MARITAL[f.marital_status]) out.maritalStatus = AI_MARITAL[f.marital_status];
  if(f.occupation) out.job = String(f.occupation).trim();
  if(f.spouse_name) out.spouseName = String(f.spouse_name).trim();
  if(f.expiry_date) out.idExpiry = String(f.expiry_date).trim();
  if(f.notes) out.aiNote = String(f.notes).trim();

}
function wireIdScan(c, docId, nidInfo){
  const state = {pending:{front:null, back:null}, ids:{front:c.idFrontFileId || null, back:c.idBackFileId || null}, expiry:c.idExpiry || '', scannedAt:c.idScannedAt || '', changed:false, texts:{}, found:{}, filled:[], notes:[], ai:'', busy:false, failed:[]};
  const btn = $('#scanBtn'), status = $('#scanStatus');
  btn.hidden = true;
  const label = side => side === 'front' ? 'وجه البطاقة' : 'ظهر البطاقة';
  const setField = (sel, val) => {
    const el = $(sel); if(!el || !val) return false;
    if(el.tagName === 'SELECT' && ![...el.options].some(o => o.value === val || o.text === val)) return false;
    if(String(el.value || '').trim()) return false;
    el.value = val; el.classList.add('filled');
    const lb = el.closest('.field')?.querySelector('label')?.textContent.replace(' *','') || '';

    el.dispatchEvent(new Event('input', {bubbles:true}));
    return true;
  };
  const apply = parsed => {
    if(parsed.idExpiry) state.expiry = parsed.idExpiry;
    setField('#f_nid', parsed.nationalId); setField('#f_idName', parsed.idName); setField('#f_addr', parsed.address); setField('#f_area', parsed.area);
    setField('#f_marital', parsed.maritalStatus); setField('#f_job', parsed.job); setField('#f_spName', parsed.spouseName);
    Object.assign(state.found, parsed);
    nidInfo();
  };
  const render = (busyMsg) => {
    if(busyMsg){ status.innerHTML = '<p class="muted" style="margin:10px 0 0">' + esc(busyMsg) + '</p>'; return; }

    if(saved.length) parts.push('<p style="color:var(--ok);font-weight:600;margin:10px 0 0">تم حفظ ' + esc(saved.join(' و')) + (state.ai ? ' وقراءتها بالذكاء الاصطناعي' : '') + '.' + (state.filled.length ? ' تمت تعبئة: ' + esc(state.filled.join('، ')) + '. الخانات المعبأة باللون الأخضر، يُرجى مراجعتها قبل الحفظ.' : ' لم تُعبأ خانات جديدة.') + '</p>');
    const diff = [['nationalId','#f_nid','الرقم القومي'],['idName','#f_idName','الاسم'],['address','#f_addr','العنوان'],['job','#f_job','المهنة'],['spouseName','#f_spName','اسم الزوج/ة']]
      .filter(([k, sel]) => f[k] && $(sel) && !$(sel).classList.contains('filled') && $(sel).value.trim() !== f[k]).map(([k,,l]) => l + ': ' + f[k]);
    if(diff.length) parts.push('<p class="muted" style="font-size:.85rem;margin:6px 0 0">قيم مقروءة تختلف عن المكتوب ولم تُستبدل:</p><ul class="scanlist">' + diff.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>');
    if(state.texts.front != null && !f.nationalId) parts.push('<p class="muted" style="font-size:.85rem;margin:6px 0 0">لم يُقرأ الرقم القومي بوضوح. صوّر البطاقة في إضاءة جيدة ومن غير انعكاس.</p>');
    state.notes.forEach(n => parts.push('<p class="muted" style="font-size:.85rem;margin:6px 0 0">' + esc(n) + '</p>'));
    state.failed.forEach(s => parts.push('<p style="color:var(--rej);font-weight:600;margin:6px 0 0">' + esc(label(s) + ': ' + idErrText(state.lastErr)) + '</p>'));
    status.innerHTML = parts.join('');
    const raw = ['front','back'].filter(s => state.texts[s]).map(s => '— ' + label(s) + ' —\n' + state.texts[s]).join('\n\n');
    $('#ocrRaw').hidden = !raw; $('#ocrRaw pre').textContent = raw;

  };
  async function processSide(side){
    const file = state.pending[side]; if(!file) return;
    const slot = $('#slot_' + side);

      render('جارٍ رفع ' + label(side) + ' وقراءتها تلقائيًا… قد يستغرق ذلك ثوانٍ قليلة.');
      const data = await imageToJpegBase64(file);
      const res = await callIdFn({action:'upload', caseId:docId, side, mime:'image/jpeg', data});
      if(state.pending[side] === file) state.pending[side] = null;
      state.ids[side] = res.fileId; state.changed = true; state.scannedAt = new Date().toISOString();

      state.failed = state.failed.filter(s => s !== side);

        state.ai = res.ai || 'ai';
        if(res.fields.is_egyptian_id === false) state.notes.push(label(side) + ': الصورة لا تبدو بطاقة رقم قومي مصرية.');
        parsed = aiToParsed(side, res.fields);

  }
  const queue = [];
  async function runQueue(){

  }
  ['front', 'back'].forEach(side => {
    $('#f_id_' + side).addEventListener('change', e => {
      const f = e.target.files && e.target.files[0]; if(!f) return;
      e.target.value = '';
      if(!/^image\//.test(f.type)){ status.innerHTML = '<p style="color:var(--rej);font-weight:600">يُرجى اختيار صورة.</p>'; return; }

      slot.querySelector('.cap').textContent = label(side) + ' — جارٍ القراءة…';
      slot.classList.remove('saved');
      if(!queue.includes(side)) queue.push(side);
      runQueue();
    });
  });
  btn.addEventListener('click', () => { state.failed.forEach(s => { if(state.pending[s] && !queue.includes(s)) queue.push(s); }); runQueue(); });
  return {
    fields: () => ({idFrontFileId: state.ids.front, idBackFileId: state.ids.back, idScannedAt: state.scannedAt || null, idExpiry: state.expiry || ''}),
    changed: () => state.changed,
    busy: () => state.busy
  };
}

function countUp(el, to, fmtFn = fmt){
  const from = el.dataset.v != null ? +el.dataset.v : 0;
  el.dataset.v = to;
  if(REDUCE || from === to){ el.textContent = fmtFn(to); return; }
  const t0 = performance.now(), dur = 750;
  cancelAnimationFrame(el._raf);
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmtFn(Math.round(from + (to - from) * e)); if(k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

function mxFloat(){
  const box = $('#mxBox'); if(!box) return;
  const w = $('.mxwrap', box); let fb = $('.mxfloat', box);
  if(!w){ fb?.remove(); return; }
  if(!fb){
    fb = document.createElement('div'); fb.className = 'mxfloat';
    fb.innerHTML = '<button type="button" data-mxs="1" aria-label="الأعمدة السابقة">→</button><input class="mxrange" type="range" min="0" max="1000" value="0" aria-label="تحريك الجدول يمينًا ويسارًا"><button type="button" data-mxs="-1" aria-label="الأعمدة التالية">←</button>';
  }
  w.after(fb);
  const r = $('.mxrange', fb);
  const over = () => Math.max(0, w.scrollWidth - w.clientWidth);
  const sync = () => { const o = over(); fb.hidden = o < 4; r.value = o ? Math.round(Math.abs(w.scrollLeft) / o * 1000) : 0; };
  sync();
  w.onscroll = sync;
  r.oninput = () => { const o = over(), rtl = getComputedStyle(w).direction === 'rtl'; w.scrollLeft = (rtl ? -1 : 1) * (+r.value / 1000) * o; };
  fb.onclick = e => { const b = e.target.closest('[data-mxs]'); if(b) w.scrollBy({left: +b.dataset.mxs * Math.max(200, w.clientWidth * .6), behavior: REDUCE ? 'auto' : 'smooth'}); };

}

let pdfLib = null;
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve(window.html2pdf);
  if(pdfLib) return pdfLib;
  pdfLib = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; sc.onload = () => res(window.html2pdf); sc.onerror = () => { pdfLib = null; rej(new Error('load')); }; document.head.appendChild(sc); });
  return pdfLib;
}
async function makePdf(filename, title, sub, inner, landscape){
  toast('جارٍ تجهيز ملف PDF…');
  let lib; try { lib = await loadPdfLib(); } catch(e){ toast('تعذّر تحميل أداة PDF، تأكد من الاتصال بالإنترنت'); return; }
  const host = document.createElement('div'); host.className = 'pdfdoc'; host.style.width = (landscape ? 1080 : 760) + 'px';
  const logo = $('.mark img')?.src || '';
  host.innerHTML = '<div class="ph"><div><h1>' + esc(title) + '</h1><div class="sub">' + sub + '</div></div>' + (logo ? '<img src="' + logo + '" alt="">' : '') + '</div>' + inner;
  const wrap = document.createElement('div'); wrap.className = 'pdfwrap'; wrap.appendChild(host); document.body.appendChild(wrap);
  // html2canvas loses the spaces between Arabic words; non-breaking spaces keep each phrase in one run
  const tw = document.createTreeWalker(host, NodeFilter.SHOW_TEXT); let tn; while((tn = tw.nextNode())) tn.nodeValue = tn.nodeValue.replace(/ +/g, '\u00A0');
  try {
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const blob = await lib().set({margin: [8, 8, 10, 8], image: {type: 'jpeg', quality: 0.95}, html2canvas: {scale: 2, backgroundColor: '#ffffff', useCORS: true},
      jsPDF: {unit: 'mm', format: 'a4', orientation: landscape ? 'landscape' : 'portrait'}, pagebreak: {mode: ['css', 'legacy'], avoid: ['tr', '.sec']}}).from(host).outputPdf('blob');
    await save(filename, blob);
  } catch(e){ console.warn('pdf', e); toast('تعذّر إنشاء ملف PDF'); }
  finally { wrap.remove(); }
}
