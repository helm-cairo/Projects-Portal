<style>

.srow:hover{border-color:var(--g1);box-shadow:var(--shadow)}

.p-ok{background:var(--sunk);color:var(--g2)}.p-bad{background:var(--reds);color:var(--red)}.p-warn{background:var(--warns);color:var(--warn)}.pill.gray{background:var(--sunk);color:var(--mute)}
.q{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:6px;cursor:pointer;user-select:none;transition:background var(--ease)}

.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);z-index:2;font-size:13px}

.cell{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--bs);background:#fff;font-size:16px;line-height:1;color:transparent;cursor:pointer}

.count{font-weight:700;color:var(--g2)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(92px + var(--sb));left:50%;transform:translateX(-50%);background:var(--g2);color:#fff;padding:8px 16px;border-radius:999px;z-index:99;font-size:14px;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--mute);padding:32px 12px}
.track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;flex:1}.track i{display:block;height:100%;background:var(--g1)}.track.low i{background:var(--yellow)}.track.bad i{background:var(--red)}
.brow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.brow>span:first-child{width:100px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brow b{width:56px;text-align:left;flex:none}
.trend{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px;overflow-x:auto}

.selbar{flex-wrap:wrap;position:fixed;bottom:calc(68px + var(--sb));right:12px;left:12px;background:var(--g2);color:#fff;border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;z-index:45;box-shadow:0 10px 30px rgba(0,104,56,.25)}
.selbar b{flex:1;padding-inline:8px}
.selbar button{border:0;border-radius:8px;padding:4px 12px;font-weight:600;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.selbar button:hover{background:rgba(255,255,255,.28)}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}.mrow.done{opacity:.55}
.mrow .n{flex:1;min-width:0}.mrow .n b{display:block;font-size:14px}
textarea.inp{min-height:110px;resize:vertical}
.hero{background:var(--g2);color:#fff;border-radius:18px;padding:16px 16px;margin:8px auto 12px;text-align:center;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero.link{cursor:pointer;transition:background var(--ease)}.hero.link:hover{background:var(--forest-h)}
.hero .eyebrow{font-size:12px;line-height:18px;font-weight:600;background:var(--yellow);color:var(--ink);border-radius:999px;padding:0 12px}
.hero .meta{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin-top:4px;font-size:13px}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.hero .d{font-weight:700;font-size:22px;line-height:32px}
.hero p{margin:2px 0 0;font-size:14px;opacity:.95}
.load{display:grid;place-items:center;height:70vh;text-align:center;color:var(--mute)}.load img{width:200px;margin-bottom:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.kv span:first-child{color:var(--mute)}
.sec{display:flex;align-items:center;gap:8px;margin:16px 0 8px}.sec h2{margin:0;flex:1}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.money .neg b{color:var(--red)}

</style>

<script>
// Real data is never stored in the code: import your sheet (Excel/CSV) from the students page.
const SEED = null;
const LOGO = "../shared/logo.png";
let db = null;
const claude = { use: async n => n === 'downloads' ? { save: async ({filename, data}) => HelmDB.download(filename, data) } : null };
const S = {courses:[], students:[], sessions:[], payments:[], expenses:[], messages:[], groups:[], settings:[], users:[], usersLoaded:false, map:{}, byC:{}, loaded:{c:false,s:false,x:false}};
const ui = {tab:'home', cid:null, ctab:'quick', q:'', fGender:'all', fGov:'all', fCourse:'all', fAge:'all', selMode:false, sel:new Set(), pick:new Set(), pq:'', pg:'all', quick:{}, qinit:false, modal:null, msg:null, toast:'', stale:false, importing:false, anCourse:'all', grid:{q:''}, msel:new Set(), mabs:false, certStyle:'f1', mses:null, period:null, mf:'all', asel:{}, mm:'', ra:'', gname:''};
const METHODS=['كاش','فودافون','إنستا','اتصالات','أخرى'];
const SOURCES=['فيسبوك','إنستجرام','واتساب','صديقة/معرفة','يوتيوب','جوجل','إعلان ممول','أخرى'];
const EDUS=['ثانوي','دبلوم','طالب جامعي','بكالوريوس','دراسات عليا'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MODES = {online:'أونلاين', offline:'حضوري', hybrid:'هايبرد'};
const AREAS={
'القاهرة':['مدينة نصر','مصر الجديدة','النزهة','التجمع الخامس','القاهرة الجديدة','الرحاب','مدينتي','الشروق','بدر','العبور','المعادي','دار السلام','البساتين','طرة','حلوان','15 مايو','المعصرة','التبين','المقطم','المنيل','مصر القديمة','السيدة زينب','الزمالك','وسط البلد','الأزبكية','عابدين','باب الشعرية','الجمالية','الدرب الأحمر','الموسكي','بولاق','الفجالة','شبرا','الساحل','روض الفرج','الشرابية','حدائق القبة','الزيتون','المطرية','عين شمس','الماظة','الأميرية','الزاوية الحمراء','المرج','السلام','النزهة الجديدة','الوايلي','العباسية','الظاهر'],
'الجيزة':['الدقي','المهندسين','العجوزة','الجيزة','الهرم','فيصل','العمرانية','الطالبية','بولاق الدكرور','إمبابة','الوراق','الكيت كات','المنيب','ناهيا','أبو النمرس','الحوامدية','البدرشين','الصف','أطفيح','العياط','أوسيم','كرداسة','المنصورية','الشيخ زايد','6 أكتوبر','حدائق الأهرام','حدائق أكتوبر','الواحات البحرية','ساقية مكي','وراق العرب','الرماية','نزلة السمان']
};
const areaOpts=(g,v)=>{ const L=AREAS[g]||[]; return '<option value="">— اختاري المنطقة —</option>'+L.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')+`<option value="__o" ${v==='__o'?'selected':''}>أخرى (اكتبي المنطقة)</option>`; };
function areaUI(f,user){ const e=f.elements, g=e['gov'].value, L=AREAS[g], sel=e['areaSel'], tx=e['area'];
  if(!L){ sel.style.display='none'; tx.style.display=''; sel.dataset.g=''; return; }
  sel.style.display='';
  if(sel.dataset.g!==g){ sel.dataset.g=g; const v=tx.value.trim(); sel.innerHTML=areaOpts(g, !v?'':(L.includes(v)?v:'__o')); }
  const v=sel.value;
  if(v==='__o'){ tx.style.display=''; if(L.includes(tx.value.trim())) tx.value=''; if(user) tx.focus(); }
  else { tx.style.display='none'; tx.value=v; }
}
const GOVS = ['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','الغربية','المنوفية','البحيرة','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح','خارج مصر'];
const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

const queues = {};
function enqueue(path, fn){ const prev=queues[path]||Promise.resolve(); const next=prev.catch(()=>{}).then(fn); queues[path]=next; return next.catch(e=>{ toast('تعذّر الحفظ، جرّب تاني'); console.error(e); }); }

function rebuild(){
  S.map={}; S.students.forEach(s=>S.map[s.id]=s);
  S.byC={}; S.sessions.forEach(x=>{ (S.byC[x.courseId]||(S.byC[x.courseId]=[])).push(x); });
  Object.values(S.byC).forEach(a=>a.sort((p,q)=>p.date.localeCompare(q.date)));
}
const held = x => x.date <= todayStr();
const isP = (x,id) => !!(x.present && x.present[id]);
const course = () => S.courses.find(c=>c.id===ui.cid);
const members = c => (c.studentIds||[]).map(id=>S.map[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const sessOf = cid => S.byC[cid]||[];
const coursesOf = id => S.courses.filter(c=>(c.studentIds||[]).includes(id));
function periodsFor(cid){ const set=new Set(); sessOf(cid).forEach(x=>set.add(x.date.slice(0,7))); S.payments.filter(p=>p.courseId===cid).forEach(p=>set.add(p.period)); S.expenses.filter(e=>e.courseId===cid).forEach(e=>set.add(e.period)); set.add(todayStr().slice(0,7)); return [...set].sort(); }
function curPeriod(c){ const ps=periodsFor(c.id); return ui.period&&ps.includes(ui.period)?ui.period:todayStr().slice(0,7); }
const paidBy = (cid,per,sid) => S.payments.filter(p=>p.courseId===cid&&p.period===per&&p.studentId===sid).reduce((a,p)=>a+(+p.amount||0),0);
function money(cid,per){ const income=S.payments.filter(p=>p.courseId===cid&&p.period===per).reduce((a,p)=>a+(+p.amount||0),0), exp=S.expenses.filter(e=>e.courseId===cid&&e.period===per).reduce((a,e)=>a+(+e.amount||0),0); return {income,exp,net:income-exp}; }
function stuRate(id, cid){ const ses=sessOf(cid).filter(held); const n=ses.filter(x=>isP(x,id)).length; return {n,t:ses.length,r:ses.length?n/ses.length:null}; }

function analyticsRows(cid){
  const cs = cid==='all'?S.courses:S.courses.filter(c=>c.id===cid), rows={};
  cs.forEach(c=>{
    const ses=sessOf(c.id).filter(held);
    (c.studentIds||[]).forEach(id=>{
      const s=S.map[id]; if(!s) return;
      const r=rows[id]||(rows[id]={s,n:0,t:0,dropped:false,last:null,nc:0}); r.nc++;
      const mine=ses.map(x=>isP(x,id)); r.n+=mine.filter(Boolean).length; r.t+=ses.length;
      if(ses.length>=4){ const rec=mine.slice(-3), ear=mine.slice(0,-3); if(ear.some(Boolean)&&!rec.some(Boolean)) r.dropped=true; }
      ses.forEach(x=>{ if(isP(x,id)&&(!r.last||x.date>r.last)) r.last=x.date; });
    });
  });
  return Object.values(rows).map(r=>({...r, rate:r.t?r.n/r.t:null, never:r.t>0&&r.n===0}));
}

function makePDF(jpegs,W,H){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); parts.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(n+' 0 obj\n'); fn(); push('\nendobj\n'); };
  const N=jpegs.length, PW=842, PH=Math.round(842*H/W);
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+jpegs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+N+' >>'));
  jpegs.forEach((j,i)=>{ const p=3+i*3;
    obj(p,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im'+i+' '+(p+1)+' 0 R >> >> /Contents '+(p+2)+' 0 R >>'));
    obj(p+1,()=>{ push('<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n'); push(j); push('\nendstream'); });
    const cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im'+i+' Do Q';
    obj(p+2,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  });
  const total=3+N*3, xr=len; push('xref\n0 '+total+'\n0000000000 65535 f \n'); for(let i=1;i<total;i++) push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
async function buildAllCertPDF(){
  const c=course(), min=c.certMin||80, ok=members(c).map(s=>({s,r:stuRate(s.id,c.id)})).filter(x=>x.r.r!=null&&x.r.r*100>=min);
  const cv=document.createElement('canvas'), jp=[]; const pg=document.getElementById('certProg');
  for(let i=0;i<ok.length;i++){ if(pg) pg.textContent='بجهّز الشهادة '+(i+1)+' من '+ok.length+'…'; await drawCert(cv,ok[i].s,c); const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92)); jp.push(new Uint8Array(await b.arrayBuffer())); }
  if(pg) pg.textContent='';
  return {blob:makePDF(jp,1400,990),n:ok.length,c};
}

const HDR=[['name',/اسم|name/i],['phone',/موبايل|تليفون|هاتف|واتس|رقم|phone|mobile/i],['email',/ايميل|إيميل|بريد|email|mail/i],['birth',/ميلاد|birth/i],['gender',/نوع|جنس|gender/i],['age',/سن|عمر|age/i],['gov',/محافظ|governorate/i],['area',/منطقة|حي|area/i],['notes',/ملاحظ|notes/i],['source',/عرفت|مصدر|منين|source/i],['job',/وظيف|مهن|شغل|عمل|job/i],['edu',/مؤهل|تعليم|دراس|education/i],['mode',/نظام|حضور|mode/i]];

    if(map){ const c=l.split('\t').map(x=>x.trim()); map.forEach((k,i)=>{ const v=c[i]; if(!v||!k) return; if(k==='name') r.name=v; else if(k==='phone') r.phone=v; else if(k==='email') r.email=v; else if(k==='birth') r.birthDate=normDate(v); else if(k==='gender') r.gender=normG(v)||defG; else if(k==='age'){ if(/^\d{1,2}$/.test(v)) r.age=+v; } else if(k==='gov') r.governorate=v; else if(k==='area') r.area=v; else if(k==='notes') r.notes=v; else if(k==='source') r.source=v; else if(k==='job') r.job=v; else if(k==='edu') r.education=v; else if(k==='mode'){ const lx=v.toLowerCase(); if(MODES[lx]) r.mode=lx; } }); return r; }

function importRows(rows,cid){

async function xlsxRows(buf){
  const files=await unzipXlsx(buf), P=new DOMParser(), tags=(d,n)=>[...d.getElementsByTagNameNS('*',n)];

    const ref=c.getAttribute('r')||'', m=ref.match(/^([A-Z]+)(\d+)$/); if(!m) return;

function csvRows(text){
  text=text.replace(/^\uFEFF/,''); const d=(text.split('\n')[0].match(/\t/g)||[]).length?'\t':((text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',');
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===d){ row.push(cur.trim()); cur=''; } else if(ch==='\n'){ row.push(cur.trim()); rows.push(row); row=[]; cur=''; } else if(ch!=='\r') cur+=ch; }

}

function starPath(x,cx,cy,R,r,n){ x.beginPath(); for(let i=0;i<n*2;i++){ const a=Math.PI*i/n-Math.PI/2, rr=i%2?r:R; x[i?'lineTo':'moveTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a)); } x.closePath(); }

function render(){
  const sy=window.scrollY;
  const a=document.activeElement, id=a&&a.id, st=a&&a.selectionStart, en=a&&a.selectionEnd;

  const oq=document.querySelector('.qchips'), og=document.getElementById('gtw'); const oldX={k:ui.skey,q:oq?oq.scrollLeft:null,g:og?og.scrollLeft:null};
  const loading=!(S.loaded.c&&S.loaded.s&&S.loaded.x&&S.usersLoaded);
  let html;
  if(loading) html=`<div class="load"><div><img src="${LOGO}" alt="حِلم"><div>${ui.stale?'مش قادرة أوصل للبيانات دلوقتي… جرّب حدّث الصفحة.':'جاري التحميل…'}</div></div></div>`;
  else if(AUTH.showCode&&authed()) html=viewCode();
  else if(!authed()) html=viewLogin();
  else html=({home:viewHome,students:viewStudents,courses:viewCourses,analytics:viewAnalytics,more:viewMore}[ui.tab])()+nav();
  let full=html+((loading||!authed())?'':viewModal());
  full=full.split(/(<textarea[\s\S]*?<\/textarea>)/).map(p=>p.startsWith('<textarea')?p:icons(p)).join('');
  document.getElementById('app').innerHTML=full+(ui.toast?`<div class="toast">${esc(ui.toast)}</div>`:'');
  const m2=document.querySelector('.modal'); if(m2&&mt) m2.scrollTop=mt;
  if(sy&&Math.abs(window.scrollY-sy)>2) window.scrollTo(0,sy);
  { const key=(ui.tab==='courses'&&ui.cid)?ui.cid+'|'+ui.ctab:null; ui.skey=key;
    const nq=document.querySelector('.qchips'), ng=document.getElementById('gtw');
    if(nq){ if(oldX.k===key&&oldX.q!==null) nq.scrollLeft=oldX.q; else { const on=[...nq.querySelectorAll('.chip.on')].pop(); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'}); } }
    if(ng){ if(oldX.k===key&&oldX.g!==null) ng.scrollLeft=oldX.g; else { const h=sessOf(ui.cid), tgt=ui.gcol&&h.some(x=>x.id===ui.gcol)?ui.gcol:(h.filter(held).pop()||h[0]||{}).id; const i=h.findIndex(x=>x.id===tgt); const th=ng.querySelectorAll('thead th')[i+1]; if(th) ng.scrollLeft=th.offsetLeft-ng.clientWidth/2+th.offsetWidth/2; } } }

}
document.addEventListener('click',e=>{

  const act=t.dataset.act;
  if(act==='setf'){ ui[t.dataset.k]=t.dataset.v; render(); return; }
  if(act==='setpg'){ ui.pg=t.dataset.v; render(); return; }
  const f=A[act]; if(f) f(t.dataset,t);
});
document.addEventListener('input',e=>{

(async function(){
  render();
  const timer=setTimeout(()=>{ if(!(S.loaded.c&&S.loaded.s&&S.loaded.x)){ ui.stale=true; render(); } },10000);
  // Sign-in + access check (redirects to login.html when needed). Real protection is RLS.
  const g=await HelmAuth.guard('attendance','login.html');

  try{ const u=await g.sb.auth.getUser(); HELM.email=(u.data&&u.data.user&&u.data.user.email)||''; }catch(e){}
  db=HelmDB.create(g.sb,{system:'attendance'});
  if(!db){ document.getElementById('app').innerHTML=`<div class="load"><div><img src="${LOGO}" alt="حِلم"><div>الحفظ مش متاح هنا — افتح الصفحة وإنتي مسجّلة دخول في Claude.</div></div></div>`; return; }
  const sub=(name,key,flag)=>db.collection(name).onSnapshot(sn=>{ S[key]=sn.docs.map(d=>({id:d.id,...d.data()})); S.loaded[flag]=true; clearTimeout(timer); ui.stale=false; rebuild(); if(S.loaded.c&&S.loaded.s) migrate(); render(); },err=>{ console.error(err); ui.stale=true; render(); });
  sub('courses','courses','c'); sub('students','students','s'); sub('sessions','sessions','x');
  const sub2=(q,key)=>q.onSnapshot(sn=>{ S[key]=sn.docs.map(d=>({id:d.id,...d.data()})); render(); },err=>console.error(err));
  S.usersLoaded=true; sub2(db.collection('settings'),'settings'); sub2(db.collection('payments'),'payments'); sub2(db.collection('expenses'),'expenses'); sub2(db.collection('groups'),'groups'); sub2(db.collection('messages').orderBy('at','desc').limit(300),'messages');
})();
